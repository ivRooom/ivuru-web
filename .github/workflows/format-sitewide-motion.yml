name: Format Sitewide Motion Branch

on:
  push:
    branches: [feat/sitewide-motion-navigation]
    paths:
      - .github/workflows/format-sitewide-motion.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sitewide-motion-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PR変更ファイルをPrettierで整形
        shell: bash
        run: |
          git fetch origin main
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z origin/main...HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
            exit 0
          fi
          npx prettier --write "${files[@]}"
      - name: 整形結果をコミット
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Prettierによる変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "性能契約テストをPrettierで整形"
          git push origin HEAD:feat/sitewide-motion-navigation
