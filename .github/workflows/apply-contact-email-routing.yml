name: Apply contact email routing

on:
  push:
    branches: [fix/contact-email-routing]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-email-routing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: メール経路を更新
        shell: python
        run: |
          from pathlib import Path

          worker = Path('src/worker.ts')
          text = worker.read_text()
          text = text.replace(
              "import { PayloadTooLargeError, readTextBodyWithLimit } from './worker/request-body';",
              "import { buildResendPayload } from './worker/email-delivery';\nimport { PayloadTooLargeError, readTextBodyWithLimit } from './worker/request-body';",
          )
          text = text.replace(
              "  CONTACT_FROM_EMAIL?: string;\n  CONTACT_RETENTION_DAYS?: string;",
              "  CONTACT_FROM_EMAIL?: string;\n  CONTACT_RECEIPT_FROM_EMAIL?: string;\n  CONTACT_RECEIPT_BCC_EMAIL?: string;\n  CONTACT_RETENTION_DAYS?: string;",
          )
          text = text.replace(
              "    replyTo?: string;\n    idempotencyKey: string;",
              "    replyTo?: string;\n    from?: string;\n    bcc?: string;\n    idempotencyKey: string;",
          )
          old = """  if (!env.RESEND_API_KEY || !env.CONTACT_FROM_EMAIL)
    throw new Error('Email provider is not configured.');
  const response = await fetchDelivery('https://api.resend.com/emails', {
"""
          new = """  const from = options.from || env.CONTACT_FROM_EMAIL;
  if (!env.RESEND_API_KEY || !from) throw new Error('Email provider is not configured.');
  const response = await fetchDelivery('https://api.resend.com/emails', {
"""
          text = text.replace(old, new)
          old_body = """    body: JSON.stringify({
      from: env.CONTACT_FROM_EMAIL,
      to: [options.to],
      subject: options.subject,
      html: options.html,
      reply_to: options.replyTo,
    }),
"""
          new_body = """    body: JSON.stringify(
      buildResendPayload({
        from,
        to: options.to,
        subject: options.subject,
        html: options.html,
        replyTo: options.replyTo,
        bcc: options.bcc,
      }),
    ),
"""
          text = text.replace(old_body, new_body)
          text = text.replace("recipient: env.CONTACT_TO_EMAIL || 'contact@ivrm.jp'", "recipient: env.CONTACT_TO_EMAIL || 'contact.ivuru@ivrm.jp'")
          text = text.replace("const recipient = env.CONTACT_TO_EMAIL || 'contact@ivrm.jp';", "const recipient = env.CONTACT_TO_EMAIL || 'contact.ivuru@ivrm.jp';")
          text = text.replace(
              "      html: receipt.html,\n      idempotencyKey: `${message.requestId}:receipt`,",
              "      html: receipt.html,\n      from: env.CONTACT_RECEIPT_FROM_EMAIL || env.CONTACT_FROM_EMAIL,\n      bcc: env.CONTACT_RECEIPT_BCC_EMAIL,\n      idempotencyKey: `${message.requestId}:receipt`,",
          )
          worker.write_text(text)

          Path('src/worker/email-delivery.ts').write_text("""export type ResendPayloadInput = {
  from: string;
  to: string;
  subject: string;
  html: string;
  replyTo?: string;
  bcc?: string;
};

export const buildResendPayload = ({
  from,
  to,
  subject,
  html,
  replyTo,
  bcc,
}: ResendPayloadInput) => ({
  from,
  to: [to],
  ...(bcc?.trim() ? { bcc: [bcc.trim()] } : {}),
  subject,
  html,
  ...(replyTo?.trim() ? { reply_to: replyTo.trim() } : {}),
});
""")

          Path('tests/unit/email-delivery.test.ts').write_text("""import { describe, expect, it } from 'vitest';
import { buildResendPayload } from '../../src/worker/email-delivery';

describe('buildResendPayload', () => {
  it('adds BCC only when configured', () => {
    expect(
      buildResendPayload({
        from: 'ivuru <info.ivuru@ivrm.jp>',
        to: 'visitor@example.com',
        bcc: 'ivuruGG.info@gmail.com',
        subject: '受付完了',
        html: '<p>accepted</p>',
      }),
    ).toMatchObject({
      from: 'ivuru <info.ivuru@ivrm.jp>',
      to: ['visitor@example.com'],
      bcc: ['ivuruGG.info@gmail.com'],
    });
  });

  it('does not emit empty optional fields', () => {
    expect(
      buildResendPayload({
        from: 'ivuru <info.ivuru@ivrm.jp>',
        to: 'contact.ivuru@ivrm.jp',
        subject: 'New contact',
        html: '<p>message</p>',
      }),
    ).toEqual({
      from: 'ivuru <info.ivuru@ivrm.jp>',
      to: ['contact.ivuru@ivrm.jp'],
      subject: 'New contact',
      html: '<p>message</p>',
    });
  });
});
""")

          wrangler = Path('wrangler.jsonc')
          config = wrangler.read_text()
          config = config.replace('"CONTACT_TO_EMAIL": "contact@ivrm.jp"', '"CONTACT_TO_EMAIL": "contact.ivuru@ivrm.jp"')
          config = config.replace(
              '"CONTACT_FROM_EMAIL": "ivuru Contact <contact@ivrm.jp>",',
              '"CONTACT_FROM_EMAIL": "ivuru Contact <info.ivuru@ivrm.jp>",\n    "CONTACT_RECEIPT_FROM_EMAIL": "ivuru Contact <info.ivuru@ivrm.jp>",\n    "CONTACT_RECEIPT_BCC_EMAIL": "ivuruGG.info@gmail.com",',
          )
          wrangler.write_text(config)

          docs = Path('CONTACT_SETUP.md')
          setup = docs.read_text()
          setup = setup.replace('CONTACT_TO_EMAIL=contact@ivrm.jp', 'CONTACT_TO_EMAIL=contact.ivuru@ivrm.jp')
          setup = setup.replace('CONTACT_FROM_EMAIL=ivuru Contact <contact@ivrm.jp>', 'CONTACT_FROM_EMAIL=ivuru Contact <info.ivuru@ivrm.jp>\nCONTACT_RECEIPT_FROM_EMAIL=ivuru Contact <info.ivuru@ivrm.jp>\nCONTACT_RECEIPT_BCC_EMAIL=ivuruGG.info@gmail.com')
          setup = setup.replace('受信先は`contact@ivrm.jp`のままです。', '管理者通知は`contact.ivuru@ivrm.jp`、自動受付メールは`info.ivuru@ivrm.jp`から送信し、受付メールのみ`ivuruGG.info@gmail.com`へBCCします。')
          setup = setup.replace('`contact@ivrm.jp`へ管理者通知が届く', '`contact.ivuru@ivrm.jp`へ管理者通知が届く')
          docs.write_text(setup)
      - run: npx prettier --write src/worker.ts src/worker/email-delivery.ts tests/unit/email-delivery.test.ts wrangler.jsonc CONTACT_SETUP.md
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivurugg.ivrm.jp
      - run: npm run deploy:check
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-contact-email-routing.yml
          git add src/worker.ts src/worker/email-delivery.ts tests/unit/email-delivery.test.ts wrangler.jsonc CONTACT_SETUP.md
          git commit -m "Contactメールの送信経路を更新"
          git push origin HEAD:fix/contact-email-routing
