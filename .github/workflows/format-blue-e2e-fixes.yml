name: Format Blue E2E Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/blue-anime-renewal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-anime-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: E2E修正ファイルを整形
        run: npx prettier --write src/components/common/MobileMenu.tsx src/components/common/IntroLoader.tsx src/components/pages/HomePage.astro src/layouts/BaseLayout.astro src/styles/blue-media-motion.css
      - name: 整形結果をコミット
        run: |
          rm .github/workflows/format-blue-e2e-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "E2E修正ファイルを整形"
          git push origin HEAD:feat/blue-anime-renewal
