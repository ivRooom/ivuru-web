name: Contact hydration競合を修正

on:
  push:
    branches: [fix/contact-hydration-race]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-hydration-race
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ContactフォームとE2Eを修正
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (text, before, after, label) => {
            if (!text.includes(before)) throw new Error(`${label}の置換対象が見つかりません。`);
            return text.replace(before, after);
          };

          const componentPath = 'src/components/contact/ContactTerminal.tsx';
          let component = fs.readFileSync(componentPath, 'utf8');
          component = replaceOnce(
            component,
            "  const started = useRef(false);\n\n  useEffect(() => {",
            "  const started = useRef(false);\n  const configLoading = config === null;\n\n  useEffect(() => {",
            'configLoading',
          );
          component = replaceOnce(
            component,
            "            <form\n              onSubmit={(event) => {",
            "            <form\n              aria-busy={configLoading}\n              onSubmit={(event) => {",
            'form aria-busy',
          );
          component = replaceOnce(
            component,
            "                  autoComplete=\"name\"\n                />",
            "                  autoComplete=\"name\"\n                  disabled={configLoading}\n                />",
            'name disabled',
          );
          component = replaceOnce(
            component,
            "                  autoComplete=\"email\"\n                />",
            "                  autoComplete=\"email\"\n                  disabled={configLoading}\n                />",
            'email disabled',
          );
          component = replaceOnce(
            component,
            "                <select value={form.category} onChange={(e) => update('category', e.target.value)}>",
            "                <select\n                  value={form.category}\n                  onChange={(e) => update('category', e.target.value)}\n                  disabled={configLoading}\n                >",
            'category disabled',
          );
          component = replaceOnce(
            component,
            "                  required\n                />\n              </label>\n              <label className=\"contact-message\">",
            "                  required\n                  disabled={configLoading}\n                />\n              </label>\n              <label className=\"contact-message\">",
            'subject disabled',
          );
          component = replaceOnce(
            component,
            "                  rows={10}\n                  required\n                />",
            "                  rows={10}\n                  required\n                  disabled={configLoading}\n                />",
            'message disabled',
          );
          component = replaceOnce(
            component,
            "                  value={form.website}\n                  onChange={(e) => update('website', e.target.value)}\n                />",
            "                  value={form.website}\n                  onChange={(e) => update('website', e.target.value)}\n                  disabled={configLoading}\n                />",
            'honeypot disabled',
          );
          component = replaceOnce(
            component,
            "                disabled={!canConfirm || config === null}",
            "                disabled={!canConfirm || configLoading}",
            'confirm disabled',
          );
          fs.writeFileSync(componentPath, component);

          const testPath = 'tests/e2e/contact.spec.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = replaceOnce(
            test,
            `  await page.route('**/api/contact', (request) => request.fulfill({\n    status: 200,\n    contentType: 'application/json',\n    body: JSON.stringify({ ready: true, turnstileSiteKey: 'test-site-key', recipient: 'contact@ivrm.jp', discordEnabled: true }),\n  }));\n\n  await page.goto('/contact');\n  await page.getByLabel('01 / お名前').fill('ivuru');`,
            `  let releaseConfig!: () => void;\n  const configGate = new Promise<void>((resolve) => {\n    releaseConfig = resolve;\n  });\n  await page.route('**/api/contact', async (request) => {\n    await configGate;\n    await request.fulfill({\n      status: 200,\n      contentType: 'application/json',\n      body: JSON.stringify({\n        ready: true,\n        turnstileSiteKey: 'test-site-key',\n        recipient: 'contact@ivrm.jp',\n        discordEnabled: true,\n      }),\n    });\n  });\n\n  await page.goto('/contact');\n  const name = page.getByLabel('01 / お名前');\n  await expect(name).toBeDisabled();\n  releaseConfig();\n  await expect(name).toBeEnabled();\n  await name.fill('ivuru');`,
            'contact config gate',
          );
          test = replaceOnce(
            test,
            "  await page.getByRole('button', { name: '送信内容を確認' }).click();",
            "  const confirmButton = page.getByRole('button', { name: '送信内容を確認' });\n  await expect(confirmButton).toBeEnabled();\n  await confirmButton.click();",
            'confirm button wait',
          );
          fs.writeFileSync(testPath, test);
          NODE
          npx prettier --write src/components/contact/ContactTerminal.tsx tests/e2e/contact.spec.ts
          rm -f .github/workflows/fix-contact-hydration-race.yml
      - name: 修正をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/contact/ContactTerminal.tsx tests/e2e/contact.spec.ts .github/workflows/fix-contact-hydration-race.yml
          git commit -m "Contactフォームのhydration競合を修正"
          git push origin HEAD:fix/contact-hydration-race
