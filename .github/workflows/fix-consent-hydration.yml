name: Fix Consent Hydration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/blue-anime-renewal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-anime-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 同意UIのHydrationとProfileテストを修正
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('src/components/pages/ProfilePage.astro')
          text = profile.read_text()
          text = text.replace('<DeferredSpotify client:visible', '<DeferredSpotify client:load')
          text = text.replace('profile icon from X', 'original blue profile character')
          text = text.replace('\n            referrerpolicy="no-referrer"', '')
          profile.write_text(text)

          social = Path('src/components/social/SocialDock.astro')
          text = social.read_text().replace('client:visible', 'client:load')
          social.write_text(text)

          site_test = Path('tests/e2e/site.spec.ts')
          text = site_test.read_text()
          text = text.replace(
              "test('profile renders X avatar, social nodes, contact email, game clips, and Favorites'",
              "test('profile renders local avatar, social nodes, contact email, game clips, and Favorites'",
          )
          text = text.replace(
              "/unavatar\\.io\\/x\\/ivuruGG/",
              "'/assets/visuals/blue-anime/ivuru-profile-blue.svg'",
          )
          site_test.write_text(text)
          PY
          npx prettier --write src/components/pages/ProfilePage.astro src/components/social/SocialDock.astro tests/e2e/site.spec.ts
      - name: 修正と一時ワークフロー削除をコミット
        run: |
          rm .github/workflows/fix-consent-hydration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "同意UIのHydration競合とProfileテストを修正"
          git push origin HEAD:feat/blue-anime-renewal
