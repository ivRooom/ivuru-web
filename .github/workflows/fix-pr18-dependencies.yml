name: PR18の依存関係競合を修正

on:
  push:
    branches: [dependabot/npm_and_yarn/testing-9eb481bc42]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/testing-9eb481bc42
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: TypeScript互換バージョンへ修正
        run: |
          npm pkg set devDependencies.typescript=6.0.3
          npm pkg set devDependencies.typescript-eslint=8.64.0
          npm install --package-lock-only --ignore-scripts
          npm ci
          rm -f .github/workflows/fix-pr18-dependencies.yml
      - name: 修正をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/fix-pr18-dependencies.yml
          git commit -m "TypeScriptとESLintの互換性を修正"
          git push origin HEAD:dependabot/npm_and_yarn/testing-9eb481bc42
