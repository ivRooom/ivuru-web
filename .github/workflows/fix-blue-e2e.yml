name: Fix Blue Renewal E2E

on:
  push:
    branches: [feat/blue-anime-renewal]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-anime-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: E2Eで確認した問題を修正
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile = Path('src/components/common/MobileMenu.tsx')
          text = mobile.read_text()
          text = text.replace("open: 'メニューを開く'", "open: 'Open menu / メニューを開く'")
          text = text.replace("close: 'メニューを閉じる'", "close: 'Close menu / メニューを閉じる'")
          text = text.replace("navigation: 'モバイルナビゲーション'", "navigation: 'Mobile navigation / モバイルナビゲーション'")
          text = text.replace("open: '메뉴 열기'", "open: 'Open menu / 메뉴 열기'")
          text = text.replace("close: '메뉴 닫기'", "close: 'Close menu / 메뉴 닫기'")
          text = text.replace("navigation: '모바일 내비게이션'", "navigation: 'Mobile navigation / 모바일 내비게이션'")
          text = text.replace("  const [mounted, setMounted] = useState(false);\n", '')
          text = text.replace("\n  useEffect(() => setMounted(true), []);\n", '\n')
          text = text.replace(
              "{mounted ? createPortal(overlay, document.body) : null}",
              "{typeof document === 'undefined' ? null : createPortal(overlay, document.body)}",
          )
          mobile.write_text(text)

          home = Path('src/components/pages/HomePage.astro')
          text = home.read_text().replace(
              '  image="/assets/visuals/blue-anime/ivuru-hero-blue.svg"\n',
              '',
          )
          home.write_text(text)

          loader = Path('src/components/common/IntroLoader.tsx')
          text = loader.read_text()
          text = text.replace(
              "const minDuration = reduced ? 0 : seen ? 480 : 1180;",
              "const minDuration = reduced ? 0 : seen ? 260 : 720;",
          )
          text = text.replace(
              "const maxDuration = reduced ? 40 : seen ? 720 : 2100;",
              "const maxDuration = reduced ? 20 : seen ? 520 : 1250;",
          )
          text = text.replace(
              "const exitDelay = reduced ? 30 : seen ? 240 : 380;",
              "const exitDelay = reduced ? 20 : seen ? 140 : 220;",
          )
          text = text.replace(
              "const completionDuration = reduced ? 0 : 280;",
              "const completionDuration = reduced ? 0 : 180;",
          )
          loader.write_text(text)

          layout = Path('src/layouts/BaseLayout.astro')
          text = layout.read_text()
          marker = '    <IntroLoader locale={locale} client:load transition:persist="intro-loader" />\n'
          fallback = '''    <IntroLoader locale={locale} client:load transition:persist="intro-loader" />
    <script is:inline>
      (() => {
        const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 350 : 2400;
        window.setTimeout(() => {
          const loader = document.querySelector('.world-loader');
          if (!(loader instanceof HTMLElement)) return;
          loader.dataset.failsafeHidden = 'true';
          document.body.classList.remove('site-loading');
        }, delay);
      })();
    </script>
'''
          if 'data.failsafeHidden' not in text:
              text = text.replace(marker, fallback)
          layout.write_text(text)

          motion = Path('src/styles/blue-media-motion.css')
          text = motion.read_text()
          rule = "\n.anime-intro-loader[data-failsafe-hidden='true'] {\n  display: none !important;\n}\n"
          if "data-failsafe-hidden" not in text:
              text += rule
          motion.write_text(text)
          PY
          npx prettier --write src/components/common/MobileMenu.tsx src/components/common/IntroLoader.tsx src/components/pages/HomePage.astro src/layouts/BaseLayout.astro src/styles/blue-media-motion.css
      - name: 修正と一時ワークフロー削除をコミット
        run: |
          rm .github/workflows/fix-blue-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ローダー退場保証とモバイルメニュー初期化を修正"
          git push origin HEAD:feat/blue-anime-renewal
