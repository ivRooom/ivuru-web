name: Temporary Restore iOS Animation

on:
  push:
    branches: [fix/ios-webkit-story-scroll]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ローダーとGSAP Directorの競合を修正
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found: {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          base_layout = 'src/layouts/BaseLayout.astro'
          replace_once(
              base_layout,
              '''    <script is:inline>
                (() => {
                  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 350 : 2400;
                  window.setTimeout(() => {
                    const loader = document.querySelector('.world-loader');
                    if (!(loader instanceof HTMLElement)) return;
                    document.documentElement.dataset.loaderReleased = 'true';
                    loader.classList.add('loaded');
                    loader.dataset.failsafeHidden = 'true';
                    document.body.classList.remove('site-loading');
                  }, delay);
                })();
              </script>''',
              '''    <script is:inline>
                (() => {
                  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
                  const releaseFailsafe = () => {
                    const loader = document.querySelector('.world-loader');
                    if (!(loader instanceof HTMLElement)) return;
                    if (
                      loader.classList.contains('loaded') ||
                      document.documentElement.dataset.loaderReleased === 'true'
                    ) {
                      return;
                    }
                    document.documentElement.dataset.loaderReleased = 'true';
                    loader.classList.add('loaded');
                    loader.dataset.failsafeHidden = 'true';
                    document.body.classList.remove('site-loading');
                  };
                  const armFailsafe = () =>
                    window.setTimeout(releaseFailsafe, reduced ? 500 : 5_000);

                  if (document.readyState === 'complete') armFailsafe();
                  else window.addEventListener('load', armFailsafe, { once: true });
                })();
              </script>''',
          )

          director = 'src/components/effects/AnimeScrollDirector.tsx'
          director_file = Path(director)
          director_text = director_file.read_text()
          if 'const isIOSWebKit = () =>' not in director_text:
              director_text = director_text.replace(
                  'const GATE_SHARD_COUNT = 10;\n',
                  '''const GATE_SHARD_COUNT = 10;

          const isIOSWebKit = () =>
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          ''',
                  1,
              )
          old_observer = '''      if (!("IntersectionObserver" in window)) {
                void initializeMotion(elements, token);
                return;
              }

              observer = new IntersectionObserver('''
          if old_observer not in director_text:
              old_observer = '''      if (!(\'IntersectionObserver\' in window)) {
                void initializeMotion(elements, token);
                return;
              }

              observer = new IntersectionObserver('''
          new_observer = '''      if (isIOSWebKit()) {
                elements.root.dataset.storyInView = 'true';
                void initializeMotion(elements, token);
                return;
              }

              if (!(\'IntersectionObserver\' in window)) {
                void initializeMotion(elements, token);
                return;
              }

              observer = new IntersectionObserver('''
          if old_observer not in director_text:
              raise SystemExit('AnimeScrollDirector observer anchor not found')
          director_file.write_text(director_text.replace(old_observer, new_observer, 1))

          runtime = 'src/components/effects/StoryProductionRuntime.tsx'
          runtime_file = Path(runtime)
          runtime_text = runtime_file.read_text()
          if 'const isIOSWebKit = () =>' not in runtime_text:
              runtime_text = runtime_text.replace(
                  'const clamp01 = (value: number) => Math.max(0, Math.min(1, value));\n',
                  '''const clamp01 = (value: number) => Math.max(0, Math.min(1, value));

          const isIOSWebKit = () =>
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          ''',
                  1,
              )
          old_timeout = '''        bootTimer = window.setTimeout(() => {
                  if (findTrigger()) return;
                  applyStaticStory(elements, 'motion-boot-timeout');
                }, BOOT_TIMEOUT_MS);'''
          new_timeout = '''        bootTimer = window.setTimeout(() => {
                  if (findTrigger()) return;
                  if (isIOSWebKit()) {
                    root.dataset.storyRuntime = 'booting';
                    root.dataset.storyProgressAuthority = 'booting';
                    root.dataset.storyRuntimeReason = 'waiting-for-ios-director';
                    ScrollTrigger?.refresh();
                    requestRender();
                    return;
                  }
                  applyStaticStory(elements, 'motion-boot-timeout');
                }, BOOT_TIMEOUT_MS);'''
          if old_timeout not in runtime_text:
              raise SystemExit('StoryProductionRuntime timeout anchor not found')
          runtime_file.write_text(runtime_text.replace(old_timeout, new_timeout, 1))
          PY

          npx prettier --write \
            src/layouts/BaseLayout.astro \
            src/components/common/LoaderReleaseGuard.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx
          npm run check
          npm run lint
          npm test
      - name: 修正をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/layouts/BaseLayout.astro \
            src/components/common/LoaderReleaseGuard.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx
          git diff --cached --quiet && exit 0
          git commit -m "iOSでロードとGSAPスクロール演出を復活"
          git push origin HEAD:fix/ios-webkit-story-scroll
