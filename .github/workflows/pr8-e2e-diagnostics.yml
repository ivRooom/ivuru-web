name: PR8 E2E diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: E2Eの失敗箇所だけを出力
        run: |
          git clone -q --depth 1 --branch fix/workers-navigation-finalize https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          set +e
          npm run test:e2e -- --project=chromium --reporter=line > /tmp/e2e.log 2>&1
          status=$?
          tail -n 130 /tmp/e2e.log
          exit $status
