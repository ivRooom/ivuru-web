name: iOS Story Temporary Format

on:
  push:
    branches:
      - fix/ios-webkit-story-scroll

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: iOS Story関連ファイルを整形
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            playwright.config.ts \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            src/components/pages/HomePageV2.astro \
            src/styles/story-ios-webkit-stability.css \
            tests/e2e/story-ios-webkit.spec.ts \
            tests/unit/ios-story-stability-contract.test.ts
      - name: 整形結果をコミット
        run: |
          if git diff --quiet; then
            echo "整形差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            playwright.config.ts \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            src/components/pages/HomePageV2.astro \
            src/styles/story-ios-webkit-stability.css \
            tests/e2e/story-ios-webkit.spec.ts \
            tests/unit/ios-story-stability-contract.test.ts
          git commit -m "iOSスクロール安定化ファイルを整形"
          git push origin HEAD:fix/ios-webkit-story-scroll
