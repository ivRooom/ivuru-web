name: iOS Story Temporary Format

on:
  push:
    branches:
      - fix/ios-webkit-story-scroll

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 契約テストを整形
        run: npx prettier --write tests/unit/ios-story-stability-contract.test.ts
      - name: 整形結果をコミット
        run: |
          if git diff --quiet; then
            echo "整形差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/ios-story-stability-contract.test.ts
          git commit -m "iOS安定化契約テストを整形"
          git push origin HEAD:fix/ios-webkit-story-scroll
