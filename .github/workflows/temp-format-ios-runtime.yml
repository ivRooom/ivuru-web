name: Temporary iOS Runtime Format

on:
  push:
    branches: [fix/ios-webkit-story-scroll]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/effects/IOSStoryRuntimeIsolation.astro
      - name: 整形結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add src/components/effects/IOSStoryRuntimeIsolation.astro
          git diff --cached --quiet && exit 0
          git commit -m "iOS Runtime分離ファイルを整形"
          git push origin HEAD:fix/ios-webkit-story-scroll
