name: Apply Home V2 E2E Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-home-v2-e2e-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-home-v2-e2e-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Home V2の静的表示とE2Eを更新
        run: python3 scripts/update-home-v2-e2e.py
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            src/styles/spatial-home-v2.css \
            tests/e2e/anime-experience.spec.ts \
            tests/e2e/hero-colorful.spec.ts \
            tests/e2e/hero-motion.spec.ts \
            tests/e2e/quality.spec.ts \
            tests/e2e/immersive-worlds.spec.ts \
            tests/e2e/contact.spec.ts \
            tests/e2e/site.spec.ts \
            tests/e2e/signal-links.spec.ts \
            tests/e2e/no-js-story.spec.ts >/dev/null
      - name: 静的検証
        run: |
          npm run check
          npm run lint
          npm test
          npm run build
      - name: Chromiumを準備
        run: npx playwright install --with-deps chromium
      - name: Home V2のE2Eを検証
        run: npm run test:e2e -- --project=chromium
      - name: 修正を反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/spatial-home-v2.css tests/e2e
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Home V2の静的表示とE2Eを更新"
          git push origin HEAD:feat/dual-3d-loading-experience
