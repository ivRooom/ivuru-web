name: Prepare Dual 3D Loader

on:
  push:
    branches: [feat/dual-3d-loading-experience]
    paths:
      - .github/workflows/prepare-dual-loader.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 不要なpresentation roleを除去
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/common/IntroLoader.astro')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  role="presentation"\n', '')
          path.write_text(source, encoding='utf-8')
          PY
      - name: 変更ファイルをPrettierで整形
        shell: bash
        run: |
          git fetch origin main
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z origin/main...HEAD -- '*.astro' '*.css' '*.html' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          npx prettier --write "${files[@]}"
      - name: 整形結果をコミット
        shell: bash
        run: |
          if git diff --quiet; then
            echo "変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "3Dローダー実装を整形"
          git push origin HEAD:feat/dual-3d-loading-experience
