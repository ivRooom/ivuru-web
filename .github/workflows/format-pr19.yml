name: Format PR19

on:
  push:
    branches: [feat/contact-queue-status]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contact-queue-status
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            CONTACT_QUEUE_D1.md \
            migrations/0001_contact_requests.sql \
            src/components/contact/ContactStatusTerminal.tsx \
            src/components/contact/ContactTerminal.tsx \
            src/components/pages/ContactStatusPage.astro \
            src/components/pages/LegalPage.astro \
            src/pages/contact/status.astro \
            src/pages/en/contact/status.astro \
            src/pages/ko/contact/status.astro \
            src/worker.ts \
            src/worker/contact-storage.test.ts \
            src/worker/contact-storage.ts \
            wrangler.contact.example.jsonc \
            wrangler.jsonc
          rm -f .github/workflows/format-pr19.yml
      - name: 整形結果をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "PR19の変更ファイルを整形"
          git push origin HEAD:feat/contact-queue-status
