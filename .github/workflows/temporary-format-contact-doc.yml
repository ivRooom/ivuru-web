name: Temporary Contact Doc Format

on:
  push:
    branches: [fix/contact-form-room-layout]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-form-room-layout
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Contact運用資料を整形
        run: npx prettier --write CONTACT_SETUP.md
      - name: 一時Workflowを削除して反映
        run: |
          rm .github/workflows/temporary-format-contact-doc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTACT_SETUP.md .github/workflows/temporary-format-contact-doc.yml
          git commit -m "Contact運用資料を整形"
          git push origin HEAD:fix/contact-form-room-layout
