name: Format colorful hero

on:
  push:
    branches: [feat/colorful-anime-hero]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/colorful-anime-hero
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/pages/HomePage.astro src/styles/hero-color-bloom.css tests/e2e/hero-colorful.spec.ts
      - name: 整形結果を反映
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/format-colorful-hero.yml
          git add src/components/pages/HomePage.astro src/styles/hero-color-bloom.css tests/e2e/hero-colorful.spec.ts
          git commit -m "カラフルヒーローの変更を整形"
          git push origin HEAD:feat/colorful-anime-hero
