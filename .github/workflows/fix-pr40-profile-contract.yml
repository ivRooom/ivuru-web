name: Fix PR40 Profile Contract

on:
  push:
    branches:
      - feat/signal-loader-art-direction

permissions:
  contents: write

jobs:
  fix-profile-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signal-loader-art-direction
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: 旧PNG期待値をブランドフォールバックへ変更
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/site.spec.ts')
          content = path.read_text(encoding='utf-8')
          old = '''test('profile renders local avatar, social nodes, contact email, game clips, and Favorites', async ({
  page,
}) => {
  await page.goto('/profile');
  await expect(page.locator('.profile-avatar-frame img')).toHaveAttribute(
    'src',
    '/assets/images/ivuru-profile-fallback.png',
  );'''
          new = '''test('profile renders brand identity, social nodes, contact email, game clips, and Favorites', async ({
  page,
}) => {
  await page.route('**/api/x-profile', async (route) => {
    await route.fulfill({ status: 503, contentType: 'application/json', body: '{}' });
  });
  await page.goto('/profile');
  const identity = page.locator('.profile-avatar-frame .x-profile-identity');
  await expect(identity).toHaveAttribute('data-x-profile-visual', 'brand');
  await expect(identity.locator('.x-profile-avatar')).toHaveCount(0);
  await expect(identity.locator('.x-profile-avatar-fallback')).toContainText('IV');'''
          if old not in content:
              raise SystemExit('profile assertion block not found')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
          npx prettier --write tests/e2e/site.spec.ts src/components/profile/XProfileIdentity.tsx tests/e2e/x-profile.spec.ts
          rm .github/workflows/fix-pr40-profile-contract.yml
      - name: 修正をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "プロフィールE2Eをブランドフォールバックへ更新"
          git push origin HEAD:feat/signal-loader-art-direction
