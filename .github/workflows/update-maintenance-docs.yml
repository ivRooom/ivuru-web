name: Update maintenance docs

on:
  push:
    branches: [chore/dependency-ci-maintenance]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-ci-maintenance
      - name: READMEを現行構成へ更新
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          replacements = {
            '- 初期リリースは完全な静的サイトです。': '- Astroで静的生成したページをCloudflare Static Assetsで配信し、`/api/contact`のみWorkerで処理します。',
            '- Cloudflare Workers Static Assets / Wrangler': '- Cloudflare Workers / Static Assets / Turnstile / Wrangler',
            '- `/privacy`, `/terms`, `/customer-harassment`, `/404`': '- `/contact`, `/privacy`, `/terms`, `/customer-harassment`, `/404`',
            '- `assets.directory`: `./dist`\n- `assets.not_found_handling`: `404-page`\n- `assets.html_handling`: `auto-trailing-slash`\n\nWorkerスクリプトの`main`は設定せず、静的成果物だけを配信します。': '- `main`: `./src/worker.ts`\n- `assets.directory`: `./dist`\n- `assets.binding`: `ASSETS`\n- `assets.run_worker_first`: `/api/*`\n- `assets.not_found_handling`: `404-page`\n- `assets.html_handling`: `auto-trailing-slash`\n- Contact用Rate Limiting binding\n- Workers Observability\n\n通常ページはStatic Assetsから配信し、`/api/contact`とその他の`/api/*`だけをWorkerへ先に通します。',
            '## Future contact form\n\n現在は受付先未設定のため送信フォームを有効化していません。次フェーズではCloudflare Worker API、Turnstile、サーバー側バリデーション、レート制限、メール送信APIを追加します。送信後の自動受付メールと、管理側Discord通知を拡張できる構成にします。': '## Contact API\n\n`/contact`、`/en/contact`、`/ko/contact`から`/api/contact`へ送信します。Worker側でOrigin、Content-Type、入力値、Honeypot、Rate Limit、Turnstileを検証し、Resendで`contact@ivrm.jp`へ通知します。受付メールとDiscord通知は補助通知です。\n\n必要な設定、通知再試行、ログ方針は[CONTACT_SETUP.md](./CONTACT_SETUP.md)と[CONTACT_DELIVERY.md](./CONTACT_DELIVERY.md)を参照してください。SecretやWebhook URLをリポジトリへ保存しないでください。',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'expected README text not found: {old[:80]}')
            text = text.replace(old, new)

          marker = '開発サーバーは通常`http://localhost:4321`で起動します。\n'
          dependency = '''\n### Dependency management\n\n`package.json`の直接依存関係は`package-lock.json`で検証済みの実バージョンへ固定しています。`.npmrc`では`save-exact=true`と`engine-strict=true`を有効化しています。依存関係の更新はDependabotの週次PRで確認し、CI・Visual Regression・Performance Budgetが成功してから取り込みます。\n'''
          if dependency.strip() not in text:
            text = text.replace(marker, marker + dependency)

          path.write_text(text)
          PY
          rm -f .github/workflows/pin-dependencies.yml
          rm -f .github/workflows/update-maintenance-docs.yml
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows
          git commit -m "READMEと一時ワークフローを整理"
          git push origin HEAD:chore/dependency-ci-maintenance
