name: Apply iOS Native Recovery

on:
  push:
    branches:
      - fix/ios-webkit-story-scroll

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 保存済み統合パッチを適用
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-ios-native-recovery.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('          PY\n', start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace('syncMotionState(realTrigger);', 'nativeRecovery = false;')
          exec(compile(script, 'ios-native-recovery-patch.py', 'exec'))
          PY
          npx prettier --write \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            src/components/pages/HomePageV2.astro \
            tests/unit/ios-story-stability-contract.test.ts
      - name: 統合結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "iOS Native RecoveryをStability Bridgeへ統合"
          git push origin HEAD:fix/ios-webkit-story-scroll
