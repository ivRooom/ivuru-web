name: Format cinematic motion once

on:
  push:
    branches:
      - feat/cinematic-motion-pass

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: ブランチを取得
        uses: actions/checkout@v4
        with:
          ref: feat/cinematic-motion-pass
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 変更ファイルをPrettierで整形
        run: |
          npx prettier --write \
            src/components/effects/CinematicPointerEffects.tsx \
            src/components/effects/ScrollEffects.tsx \
            src/components/home/WorldPortalSection.astro \
            src/components/pages/HomePage.astro \
            src/layouts/BaseLayout.astro \
            src/styles/cinematic-motion.css \
            src/styles/cinematic-motion-overrides.css \
            tests/e2e/hero-motion.spec.ts

      - name: 一時ワークフローを削除してコミット
        run: |
          rm .github/workflows/format-cinematic-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "シネマティックモーションのFormatを整形"
          git push origin HEAD:feat/cinematic-motion-pass
