name: PR18のLintエラーを診断

on:
  push:
    branches: [dependabot/npm_and_yarn/testing-9eb481bc42]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/testing-9eb481bc42
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint結果を記録
        shell: bash
        run: |
          set +e
          npm run lint > .github/pr18-lint-report.txt 2>&1
          status=$?
          set -e
          printf '\nexit_code=%s\n' "$status" >> .github/pr18-lint-report.txt
          rm -f .github/workflows/diagnose-pr18-lint.yml
      - name: 診断結果をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr18-lint-report.txt .github/workflows/diagnose-pr18-lint.yml
          git commit -m "PR18のLint診断結果を記録"
          git push origin HEAD:dependabot/npm_and_yarn/testing-9eb481bc42
