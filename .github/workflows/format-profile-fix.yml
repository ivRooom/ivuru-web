name: Format Profile Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/blue-anime-renewal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-anime-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Profile修正ファイルを整形
        run: npx prettier --write EDITORIAL_DESIGN.md src/data/site-config.ts tests/e2e/profile-avatar.spec.ts
      - name: 整形結果をコミット
        run: |
          rm .github/workflows/format-profile-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Profile修正ファイルを整形"
          git push origin HEAD:feat/blue-anime-renewal
