name: Format iOS Recovery Final

on:
  push:
    branches:
      - fix/ios-webkit-story-scroll

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/effects/IOSStoryDirectorRecovery.astro
      - name: 整形結果をコミット
        run: |
          if git diff --quiet; then
            echo "整形差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add src/components/effects/IOSStoryDirectorRecovery.astro
          git commit -m "iOS Recovery最終修正を整形"
          git push origin HEAD:fix/ios-webkit-story-scroll
