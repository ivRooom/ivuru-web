name: Pin Wrangler

on:
  push:
    branches: [chore/dependency-ci-maintenance]

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-ci-maintenance
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Wranglerを固定
        run: |
          npm pkg set devDependencies.wrangler=4.110.0
          npm install --package-lock-only --ignore-scripts
          npx prettier --write package.json package-lock.json
          rm -f .github/workflows/pin-wrangler.yml
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Wranglerを4.110.0へ固定"
          git push origin HEAD:chore/dependency-ci-maintenance
