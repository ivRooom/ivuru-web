name: Update Profile Signal Shelf

on:
  push:
    branches:
      - feat/signal-loader-art-direction

permissions:
  contents: write

jobs:
  update-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signal-loader-art-direction
      - name: Profileの仮画像を信号棚へ置換
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/pages/ProfilePage.astro')
          content = path.read_text(encoding='utf-8')
          old = '''      <figure class="profile-favorites-visual" data-reveal>
        <img
          src="/assets/images/ivuru-profile-scene.png"
          alt=""
          width="1200"
          height="800"
          loading="lazy"
        />
        <figcaption>{copy.illustrationCaption}</figcaption>
      </figure>'''
          new = '''      <figure class="profile-favorites-visual profile-signal-shelf" data-reveal>
        <article class="profile-shelf-module">
          <small>01 / BUILD</small>
          <strong>CODE</strong>
          <span>Web · Cloud · Automation</span>
        </article>
        <article class="profile-shelf-module">
          <small>02 / PLAY</small>
          <strong>GAME</strong>
          <span>Clips · Streams · Sessions</span>
        </article>
        <article class="profile-shelf-module">
          <small>03 / SOUND</small>
          <strong>MUSIC</strong>
          <span>Focus · Night · Replay</span>
        </article>
        <article class="profile-shelf-module">
          <small>04 / LINK</small>
          <strong>COMMUNITY</strong>
          <span>ivRm · Discord · Friends</span>
        </article>
        <figcaption>{copy.illustrationCaption}</figcaption>
      </figure>'''
          if old not in content:
              raise SystemExit('target block not found')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/update-profile-signal-shelf.yml
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "プロフィールの仮イラストを信号棚へ変更"
          git push origin HEAD:feat/signal-loader-art-direction
