name: PR14 performance diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - name: Performance Budget結果だけを表示
        run: |
          git clone -q --depth 1 --branch feat/quality-command-center-analytics https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          npm run build --silent >/dev/null
          npm run performance:check
