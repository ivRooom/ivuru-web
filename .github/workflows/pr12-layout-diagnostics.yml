name: PR12 layout diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: レイアウト回帰テストの失敗箇所だけを出力
        run: |
          git clone -q --depth 1 --branch fix/profile-header-portfolio-layout https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          set +e
          npm run test:e2e -- tests/e2e/site.spec.ts --project=chromium --reporter=line --grep "mobile menu|header stays|profile passport|developer portfolio" > /tmp/layout-e2e.log 2>&1
          status=$?
          tail -n 180 /tmp/layout-e2e.log
          exit $status
