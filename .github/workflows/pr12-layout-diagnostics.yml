name: PR12 layout diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: レイアウトの実寸値を出力
        run: |
          git clone -q --depth 1 --branch fix/profile-header-portfolio-layout https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          npm run test:e2e -- tests/e2e/layout-debug.spec.ts --project=chromium --reporter=line > /tmp/layout-debug.log 2>&1
          grep -E "PROFILE_OVERFLOW|MENU_BOX|failed|passed" /tmp/layout-debug.log | tail -n 120
