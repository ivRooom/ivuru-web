name: Temporary Animation Format

on:
  push:
    branches: [fix/ios-webkit-story-scroll]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prettierを適用
        run: >-
          npx prettier --write
          src/components/effects/IOSStoryRuntimeIsolation.astro
          src/components/effects/IOSStoryDirectorRecovery.astro
          tests/unit/ios-story-director-recovery-contract.test.ts
          tests/e2e/story-ios-webkit.spec.ts
      - name: 整形結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/IOSStoryRuntimeIsolation.astro \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            tests/unit/ios-story-director-recovery-contract.test.ts \
            tests/e2e/story-ios-webkit.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "アニメーション復活修正を整形"
          git push origin HEAD:fix/ios-webkit-story-scroll
