name: Format PR33 Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/blue-anime-renewal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-anime-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PR変更ファイルを個別整形
        shell: bash
        run: |
          git fetch origin main
          : > prettier-diagnostics.txt
          status=0
          while IFS= read -r -d '' file; do
            printf '\n=== %s ===\n' "$file" >> prettier-diagnostics.txt
            if npx prettier --write "$file" >> prettier-diagnostics.txt 2>&1; then
              echo 'OK' >> prettier-diagnostics.txt
            else
              echo 'FAILED' >> prettier-diagnostics.txt
              status=1
            fi
          done < <(git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD -- '*.astro' '*.tsx' '*.ts' '*.css' '*.md' '*.svg')
          echo "overall_status=$status" >> prettier-diagnostics.txt
      - name: Prettier診断を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diagnostics-pr33
          path: prettier-diagnostics.txt
          retention-days: 7
      - name: 整形結果をコミット
        run: |
          rm .github/workflows/format-pr33-final.yml
          rm -f prettier-diagnostics.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR #33の変更ファイルを最終整形"
          git push origin HEAD:feat/blue-anime-renewal
