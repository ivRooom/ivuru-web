name: Format PR33 Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/blue-anime-renewal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blue-anime-renewal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PR変更ファイルを整形
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD -- '*.astro' '*.tsx' '*.ts' '*.css' '*.md' '*.svg' | xargs -0 -r npx prettier --write
      - name: 整形結果をコミット
        run: |
          rm .github/workflows/format-pr33-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR #33の変更ファイルを最終整形"
          git push origin HEAD:feat/blue-anime-renewal
