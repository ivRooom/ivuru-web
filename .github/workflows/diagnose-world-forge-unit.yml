name: Diagnose World Forge Unit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-world-forge-unit.yml
      - src/components/common/IntroLoader.astro
      - src/components/effects/AnimeScrollDirector.tsx
      - src/components/effects/SpatialCameraEnhancer.tsx
      - src/styles/chapter-gate-transitions.css
      - src/styles/quantum-gate-loader.css
      - tests/unit/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Vitest診断結果を生成
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile=unit-results.json
      - name: 診断Artifactを保存
        uses: actions/upload-artifact@v4
        with:
          name: world-forge-unit-results
          path: unit-results.json
          retention-days: 1
