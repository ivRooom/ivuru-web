name: Fix PR39 Contracts

on:
  push:
    branches:
      - feat/anime-cyber-png-x-profile

permissions:
  contents: write

jobs:
  fix-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-cyber-png-x-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: 表示契約と画像期待値を更新
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path('src/components/pages/ProfilePage.astro')
          profile.write_text(
              profile.read_text().replace('UPDATED / LIVE', 'UPDATED / AUTO'),
              encoding='utf-8',
          )

          replacements = {
              '/assets/visuals/blue-anime/ivuru-profile-blue.svg': '/assets/images/ivuru-profile-fallback.png',
              '/assets/visuals/blue-anime/ivuru-hero-blue.svg': '/assets/images/ivuru-hero-character.png',
              r'/\/assets\/og\/ivuru-brand-og\.svg$/': r'/\/assets\/og\/og-background\.png$/',
          }
          for path in Path('tests/e2e').glob('*.spec.ts'):
              content = path.read_text(encoding='utf-8')
              updated = content
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != content:
                  path.write_text(updated, encoding='utf-8')
          PY
          npx prettier --write src/components/pages/ProfilePage.astro tests/e2e/site.spec.ts
          rm .github/workflows/fix-pr39-contracts.yml
      - name: 修正をコミット
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR39の表示契約と旧画像期待値を更新"
          git push origin HEAD:feat/anime-cyber-png-x-profile
