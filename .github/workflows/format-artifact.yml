name: Temporary Format Artifact

on:
  push:
    branches:
      - fix/community-contact-usability
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 変更ファイルをPrettierで整形
        run: |
          npx prettier --write \
            src/components/contact/ContactTerminal.tsx \
            src/components/home/CommunitySection.astro \
            src/styles/contact-validation.css \
            tests/e2e/contact.spec.ts
      - name: 整形結果をブランチへ反映
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/contact/ContactTerminal.tsx \
            src/components/home/CommunitySection.astro \
            src/styles/contact-validation.css \
            tests/e2e/contact.spec.ts
          if git diff --cached --quiet; then
            echo "整形差分はありません。"
          else
            git commit -m "変更ファイルを整形"
            git push origin HEAD:fix/community-contact-usability
          fi
      - name: 整形済みファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: |
            src/components/contact/ContactTerminal.tsx
            src/components/home/CommunitySection.astro
            src/styles/contact-validation.css
            tests/e2e/contact.spec.ts
          retention-days: 1
