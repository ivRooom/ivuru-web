name: Fix Dual Loader CI

on:
  push:
    branches: [feat/dual-3d-loading-experience]
    paths:
      - .github/workflows/fix-dual-loader-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: LintとリロードE2Eを修正
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path('src/components/common/IntroLoader.astro')
          source = loader.read_text(encoding='utf-8')
          old = """    let seen = true;
              try {
                seen = sessionStorage.getItem('ivuru-intro-seen') === '1';
                sessionStorage.setItem('ivuru-intro-seen', '1');
              } catch {
                seen = true;
              }
          """
          new = """    const seen = (() => {
                try {
                  const hasSeen = sessionStorage.getItem('ivuru-intro-seen') === '1';
                  sessionStorage.setItem('ivuru-intro-seen', '1');
                  return hasSeen;
                } catch {
                  return true;
                }
              })();
          """
          if old not in source:
              raise SystemExit('IntroLoader replacement target not found')
          source = source.replace(old, new)
          source = source.replace(
              "background: radial-gradient(circle at 50% 50%, transparent 45%, rgb(0 0 0 / 42%) 100%);",
              "background: radial-gradient(circle at 50% 50%, transparent 45%, rgb(0 0 0 / 42%) 100%);\n    animation: none;",
              1,
          )
          loader.write_text(source, encoding='utf-8')

          test = Path('tests/e2e/loader-metadata.spec.ts')
          source = test.read_text(encoding='utf-8')
          old = """    sessionStorage.removeItem('ivuru-loader-theme');
              sessionStorage.setItem('ivuru-intro-seen', '1');
          """
          new = """    if (sessionStorage.getItem('ivuru-loader-test-prepared') !== '1') {
                sessionStorage.removeItem('ivuru-loader-theme');
                sessionStorage.setItem('ivuru-loader-test-prepared', '1');
              }
              sessionStorage.setItem('ivuru-intro-seen', '1');
          """
          if old not in source:
              raise SystemExit('E2E replacement target not found')
          test.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: 変更ファイルを整形・検証
        run: |
          npx prettier --write src/components/common/IntroLoader.astro tests/e2e/loader-metadata.spec.ts
          npm run lint
          npm test -- --run tests/unit/dual-3d-loader-contract.test.ts
      - name: 修正をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/common/IntroLoader.astro tests/e2e/loader-metadata.spec.ts
          git commit -m "3DローダーのLintとリロードテストを修正"
          git push origin HEAD:feat/dual-3d-loading-experience
