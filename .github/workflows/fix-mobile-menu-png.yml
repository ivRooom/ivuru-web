name: Fix Mobile Menu PNG

on:
  push:
    branches:
      - feat/anime-cyber-png-x-profile

permissions:
  contents: write

jobs:
  fix-mobile-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-cyber-png-x-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: モバイルメニュー画像をPNGへ変更
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/common/MobileMenu.tsx')
          path.write_text(
              path.read_text(encoding='utf-8').replace(
                  '/assets/visuals/blue-anime/ivuru-hero-blue.svg',
                  '/assets/images/ivuru-hero-character.png',
              ),
              encoding='utf-8',
          )
          PY
          npx prettier --write src/components/common/MobileMenu.tsx
          rm .github/workflows/fix-mobile-menu-png.yml
      - name: 修正をコミット
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "モバイルメニューのイラストをPNGへ統一"
          git push origin HEAD:feat/anime-cyber-png-x-profile
