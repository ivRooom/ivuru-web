name: PR14 lint diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: ESLint指摘だけを表示
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          status=$?
          tail -n 80 /tmp/lint.log
          exit $status
