name: PR14 lint diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: ESLint指摘だけを表示
        run: |
          git clone -q --depth 1 --branch feat/quality-command-center-analytics https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          set +e
          npm run lint > /tmp/lint.log 2>&1
          status=$?
          grep -E '^/home/|^[[:space:]]*[0-9]+:[0-9]+|error|warning|problems' /tmp/lint.log | tail -n 60
          exit $status
