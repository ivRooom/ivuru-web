name: Export source snapshot

on:
  push:
    branches: [chore/source-export-temp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ソースをArtifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: ivuru-web-source
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          retention-days: 1
