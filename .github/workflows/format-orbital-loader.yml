name: Format Orbital Loader

on:
  push:
    branches: [feat/dual-3d-loading-experience]
    paths:
      - .github/workflows/format-orbital-loader.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-orbital-loader.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/dual-3d-loading-experience
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Orbital Core関連ファイルを整形
        run: |
          npx prettier --write \
            src/components/common/IntroLoader.astro \
            docs/demos/orbital-core-loader.html \
            tests/e2e/loader-metadata.spec.ts \
            tests/unit/orbital-loader-contract.test.ts
      - name: LintとUnitを確認
        run: |
          npm run lint
          npm test -- --run tests/unit/orbital-loader-contract.test.ts
      - name: 整形結果をContents APIで反映
        shell: bash
        run: |
          files=(
            src/components/common/IntroLoader.astro
            docs/demos/orbital-core-loader.html
            tests/e2e/loader-metadata.spec.ts
            tests/unit/orbital-loader-contract.test.ts
          )

          for path in "${files[@]}"; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha)
            encoded=$(base64 -w 0 "${path}")
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="Orbital Core実装を整形: ${path}" \
              -f content="${encoded}" \
              -f branch="${TARGET_BRANCH}" \
              -f sha="${sha}" >/dev/null
          done
