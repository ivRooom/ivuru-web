name: Format Orbital Loader

on:
  push:
    branches: [feat/dual-3d-loading-experience]
    paths:
      - .github/workflows/format-orbital-loader.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-orbital-loader.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Orbital Core関連ファイルを整形
        run: |
          npx prettier --write \
            src/components/common/IntroLoader.astro \
            docs/demos/orbital-core-loader.html \
            tests/e2e/loader-metadata.spec.ts \
            tests/unit/orbital-loader-contract.test.ts
      - name: LintとUnitを確認
        run: |
          npm run lint
          npm test -- --run tests/unit/orbital-loader-contract.test.ts
      - name: 整形済みファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: orbital-loader-formatted
          path: |
            src/components/common/IntroLoader.astro
            docs/demos/orbital-core-loader.html
            tests/e2e/loader-metadata.spec.ts
            tests/unit/orbital-loader-contract.test.ts
          if-no-files-found: error
          retention-days: 1
