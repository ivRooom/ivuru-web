name: Publish Home V2 E2E Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-home-v2-e2e-fixes.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - run: python3 scripts/update-home-v2-e2e.py
      - name: 整形
        run: |
          npx prettier --write src/styles/spatial-home-v2.css tests/e2e >/dev/null
      - name: 静的検証
        run: |
          npm run check
          npm run lint
          npm test
          npm run build
      - name: 検証済み修正を反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/spatial-home-v2.css tests/e2e
          git commit -m "Home V2の静的表示とE2Eを更新"
          git push origin HEAD:feat/dual-3d-loading-experience
