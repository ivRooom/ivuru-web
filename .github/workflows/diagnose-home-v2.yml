name: Diagnose Home V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-home-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: 変更ファイルをPrettierで整形
        run: |
          npx prettier --write \
            src/components/home/AnimeScrollStory.astro \
            src/components/home/HomePortalGrid.astro \
            src/components/pages/HomePageV2.astro \
            src/components/effects/SpatialCameraEnhancer.tsx \
            src/components/home/FeaturedWorks.astro \
            src/components/blog/LatestPosts.astro \
            src/styles/spatial-home-v2.css \
            src/pages/index.astro \
            src/pages/en/index.astro \
            src/pages/ko/index.astro >/dev/null
      - name: 整形後の検証
        run: |
          npm run check
          npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: home-v2-formatted
          path: |
            src/components/home/AnimeScrollStory.astro
            src/components/home/HomePortalGrid.astro
            src/components/pages/HomePageV2.astro
            src/components/effects/SpatialCameraEnhancer.tsx
            src/components/home/FeaturedWorks.astro
            src/components/blog/LatestPosts.astro
            src/styles/spatial-home-v2.css
            src/pages/index.astro
            src/pages/en/index.astro
            src/pages/ko/index.astro
          retention-days: 1
