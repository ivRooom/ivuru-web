name: Diagnose Home V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-home-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Astro Checkログを保存
        continue-on-error: true
        run: npm run check > home-v2-check.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: home-v2-check-log
          path: home-v2-check.log
          retention-days: 1
