name: Format Home V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-home-v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Prettierを適用
        run: |
          npx prettier --write \
            src/components/home/AnimeScrollStory.astro \
            src/components/home/HomePortalGrid.astro \
            src/components/pages/HomePageV2.astro \
            src/components/effects/SpatialCameraEnhancer.tsx \
            src/components/home/FeaturedWorks.astro \
            src/components/blog/LatestPosts.astro \
            src/styles/spatial-home-v2.css \
            src/pages/index.astro \
            src/pages/en/index.astro \
            src/pages/ko/index.astro >/dev/null
      - name: 整形後を検証
        run: |
          npm run check
          npm run lint
      - name: 整形結果を反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "トップページV2を標準整形"
          git push origin HEAD:feat/dual-3d-loading-experience
