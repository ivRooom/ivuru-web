name: Story Runtime Temporary Format

on:
  push:
    branches:
      - fix/story-engine-production-stability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-engine-production-stability
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Story Runtime関連ファイルを整形
        run: |
          npx prettier --write \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/home/StorySkipLink.astro \
            src/components/pages/HomePageV2.astro \
            src/styles/story-production-runtime.css \
            tests/e2e/story-production-runtime.spec.ts \
            tests/unit/story-production-runtime-contract.test.ts
      - name: 整形結果をコミット
        run: |
          if git diff --quiet; then
            echo "整形差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/home/StorySkipLink.astro \
            src/components/pages/HomePageV2.astro \
            src/styles/story-production-runtime.css \
            tests/e2e/story-production-runtime.spec.ts \
            tests/unit/story-production-runtime-contract.test.ts
          git commit -m "Story RuntimeをPrettierで整形"
          git push origin HEAD:fix/story-engine-production-stability
