name: Temporary Motion Format

on:
  push:
    branches:
      - feat/cinematic-motion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 変更ファイルを整形
        run: npx prettier --write src/components/pages/HomePage.astro src/components/effects/ScrollEffects.tsx src/styles/hero-motion.css tests/e2e/hero-motion.spec.ts
      - name: 整形結果を反映
        run: |
          rm .github/workflows/tmp-format-motion.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/pages/HomePage.astro src/components/effects/ScrollEffects.tsx src/styles/hero-motion.css tests/e2e/hero-motion.spec.ts .github/workflows/tmp-format-motion.yml
          git commit -m "シネマティックモーションの変更を整形"
          git push origin HEAD:feat/cinematic-motion
