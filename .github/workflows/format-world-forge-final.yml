name: Format World Forge Final

on:
  push:
    branches:
      - feat/dual-3d-loading-experience
    paths:
      - .github/workflows/format-world-forge-final.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ivRooom/ivuru-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
          fetch-depth: 0
          persist-credentials: false

      - run: npm ci --ignore-scripts --silent

      - name: 最終契約テストを整形
        run: npx prettier --write tests/unit/world-forge-final-contract.test.ts

      - name: 整形を反映して一時ワークフローを削除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm .github/workflows/format-world-forge-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'World Forge最終契約をPrettierで整形'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/dual-3d-loading-experience
