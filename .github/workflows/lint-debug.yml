name: Lint diagnostics

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run lint with concise setup
        run: |
          git clone -q --depth 1 --branch fix/navigation-loader-world-experience https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent
          npm run lint
