name: Export Cinematic Format

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-cinematic-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: Prettierで整形
        run: |
          npx prettier --write \
            src/components/effects/CinematicEntertainmentDirector.tsx \
            src/components/home/AnimeScrollStory.astro \
            src/components/pages/HomePageV2.astro \
            src/styles/cinematic-entertainment.css \
            tests/unit/cinematic-entertainment-contract.test.ts \
            tests/e2e/cinematic-entertainment.spec.ts
      - name: 整形済みファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-formatted-files
          path: |
            src/components/effects/CinematicEntertainmentDirector.tsx
            src/components/home/AnimeScrollStory.astro
            src/components/pages/HomePageV2.astro
            src/styles/cinematic-entertainment.css
            tests/unit/cinematic-entertainment-contract.test.ts
            tests/e2e/cinematic-entertainment.spec.ts
          retention-days: 1
