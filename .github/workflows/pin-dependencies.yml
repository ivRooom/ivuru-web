name: Pin dependencies

on:
  push:
    branches: [chore/dependency-ci-maintenance]

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-ci-maintenance
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lockfileの実バージョンへ固定
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] ?? {})) {
              if (pkg[section][name] !== 'latest') continue;
              const version = lock.packages?.[`node_modules/${name}`]?.version;
              if (!version) throw new Error(`lockfile version not found: ${name}`);
              pkg[section][name] = version;
            }
          }
          await writeFile('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          printf 'save-exact=true\nengine-strict=true\n' > .npmrc
          npm install --package-lock-only --ignore-scripts
      - name: 変更をコミット
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .npmrc
          git commit -m "依存関係をlockfileの実バージョンへ固定"
          git push origin HEAD:chore/dependency-ci-maintenance
