name: Rerun Spatial Scroll Motion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rerun-spatial-scroll-motion.yml

permissions:
  contents: write

concurrency:
  group: rerun-spatial-scroll-motion
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: 生成処理を補正して実行
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-spatial-scroll-motion.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          script = script.replace(
              "const profile = SPATIAL_SCENE_PROFILES[sceneIndex % SPATIAL_SCENE_PROFILES.length];",
              "const profile = SPATIAL_SCENE_PROFILES[sceneIndex % SPATIAL_SCENE_PROFILES.length]!;",
          )
          script = script.replace(
              "const profile = REVEAL_PROFILES[profileIndex % REVEAL_PROFILES.length];",
              "const profile = REVEAL_PROFILES[profileIndex % REVEAL_PROFILES.length]!;",
          )
          script = script.replace(
              "const profile = PARALLAX_PROFILES[profileIndex % PARALLAX_PROFILES.length];",
              "const profile = PARALLAX_PROFILES[profileIndex % PARALLAX_PROFILES.length]!;",
          )
          script = script.replace("expect(source.match(/sceneIn:/g)).toHaveLength(4);", "expect(source.match(/sceneIn:/g)).toHaveLength(5);")
          script = script.replace("expect(source.match(/sceneOut:/g)).toHaveLength(4);", "expect(source.match(/sceneOut:/g)).toHaveLength(5);")
          exec(compile(script, 'spatial-scroll-generator', 'exec'))
          PY
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/ScrollEffects.tsx \
            src/styles/scroll-performance.css \
            src/styles/anime-scroll-story.css \
            tests/unit/spatial-scroll-motion-contract.test.ts
      - name: 実装を検証
        run: |
          set -o pipefail
          npm run check 2>&1 | tail -n 120
          npm run lint 2>&1 | tail -n 120
          npm test 2>&1 | tail -n 160
          npm run build 2>&1 | tail -n 160
      - name: 変更をブランチへ反映
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: feat/dual-3d-loading-experience
        run: |
          for file in \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/ScrollEffects.tsx \
            src/styles/scroll-performance.css \
            src/styles/anime-scroll-story.css \
            tests/unit/spatial-scroll-motion-contract.test.ts
          do
            content=$(base64 -w 0 "$file")
            if gh api "repos/$REPO/contents/$file?ref=$BRANCH" --silent >/dev/null 2>&1; then
              sha=$(gh api "repos/$REPO/contents/$file?ref=$BRANCH" --jq .sha)
              gh api --method PUT "repos/$REPO/contents/$file" \
                -f message="多方向3Dスクロール演出を実装" \
                -f content="$content" \
                -f branch="$BRANCH" \
                -f sha="$sha"
            else
              gh api --method PUT "repos/$REPO/contents/$file" \
                -f message="多方向3Dスクロール演出の契約テストを追加" \
                -f content="$content" \
                -f branch="$BRANCH"
            fi
          done