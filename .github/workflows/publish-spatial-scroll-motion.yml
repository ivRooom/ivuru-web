name: Publish Spatial Scroll Motion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-spatial-scroll-motion.yml

permissions:
  contents: write

concurrency:
  group: publish-spatial-scroll-motion
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: 最終版を生成
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-spatial-scroll-motion.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          replacements = {
              "const profile = SPATIAL_SCENE_PROFILES[sceneIndex % SPATIAL_SCENE_PROFILES.length];": "const profile = SPATIAL_SCENE_PROFILES[sceneIndex % SPATIAL_SCENE_PROFILES.length]!;",
              "const profile = REVEAL_PROFILES[profileIndex % REVEAL_PROFILES.length];": "const profile = REVEAL_PROFILES[profileIndex % REVEAL_PROFILES.length]!;",
              "const profile = PARALLAX_PROFILES[profileIndex % PARALLAX_PROFILES.length];": "const profile = PARALLAX_PROFILES[profileIndex % PARALLAX_PROFILES.length]!;",
              "expect(source.match(/sceneIn:/g)).toHaveLength(4);": "expect(source.match(/sceneIn:/g)).toHaveLength(5);",
              "expect(source.match(/sceneOut:/g)).toHaveLength(4);": "expect(source.match(/sceneOut:/g)).toHaveLength(5);",
              "expect(source).toContain('data.scrollRevealDirection');": "expect(source).toContain('dataset.scrollRevealDirection');",
              "expect(source).toContain('data.scrollParallaxDirection');": "expect(source).toContain('dataset.scrollParallaxDirection');",
          }
          for old, new in replacements.items():
              script = script.replace(old, new)
          script = script.replace(
              r'''expect(source).toContain("[data-story-depth=\"far\"]");''',
              r'''expect(source).toContain('[data-story-depth="far"]');''',
          )
          script = script.replace(
              r'''expect(source).toContain("[data-story-depth=\"mid\"]");''',
              r'''expect(source).toContain('[data-story-depth="mid"]');''',
          )
          script = script.replace(
              r'''expect(source).toContain("[data-story-depth=\"near\"]");''',
              r'''expect(source).toContain('[data-story-depth="near"]');''',
          )
          script = script.replace(
              r'''expect(source).not.toMatch(/addEventListener\(\s*['\"]scroll['\"]/);''',
              r'''expect(source).not.toMatch(/addEventListener\(\s*['"]scroll['"]/);''',
          )
          exec(compile(script, 'spatial-scroll-publisher', 'exec'))
          PY
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/ScrollEffects.tsx \
            src/styles/scroll-performance.css \
            src/styles/anime-scroll-story.css \
            tests/unit/spatial-scroll-motion-contract.test.ts >/dev/null
      - name: Astro Check
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Unit Test
        run: npm test
      - name: Production Build
        run: npm run build
      - name: 変更をブランチへ反映
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: feat/dual-3d-loading-experience
        run: |
          for file in \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/ScrollEffects.tsx \
            src/styles/scroll-performance.css \
            src/styles/anime-scroll-story.css \
            tests/unit/spatial-scroll-motion-contract.test.ts
          do
            content=$(base64 -w 0 "$file")
            if gh api "repos/$REPO/contents/$file?ref=$BRANCH" --silent >/dev/null 2>&1; then
              sha=$(gh api "repos/$REPO/contents/$file?ref=$BRANCH" --jq .sha)
              gh api --method PUT "repos/$REPO/contents/$file" \
                -f message="多方向3Dスクロール演出を実装" \
                -f content="$content" \
                -f branch="$BRANCH" \
                -f sha="$sha"
            else
              gh api --method PUT "repos/$REPO/contents/$file" \
                -f message="多方向3Dスクロール演出の契約テストを追加" \
                -f content="$content" \
                -f branch="$BRANCH"
            fi
          done