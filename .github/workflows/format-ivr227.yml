name: Format IVR-227

on:
  push:
    branches:
      - feat/anime-scroll-story

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-scroll-story
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: IVR-227変更ファイルを整形
        run: |
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/styles/anime-scroll-story-overrides.css \
            tests/e2e/hero-motion.spec.ts
          rm .github/workflows/format-ivr227.yml
      - name: 整形結果を反映
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "IVR-227の変更ファイルを整形"
          git push origin HEAD:feat/anime-scroll-story
