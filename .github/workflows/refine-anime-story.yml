name: Refine Anime Story

on:
  push:
    branches:
      - feat/anime-scroll-story

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-scroll-story
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: 視差変数と非表示シーンの操作性を調整
        run: |
          python - <<'PY'
          from pathlib import Path

          director_path = Path('src/components/effects/AnimeScrollDirector.tsx')
          director = director_path.read_text(encoding='utf-8')
          director = director.replace(
              "    scene.setAttribute('aria-hidden', active ? 'false' : 'true');",
              "    scene.setAttribute('aria-hidden', active ? 'false' : 'true');\n    scene.inert = !active;",
          )
          director = director.replace(
              "      root.style.setProperty('--story-pointer-x', '0');\n      root.style.setProperty('--story-pointer-y', '0');",
              "      root.style.setProperty('--story-pointer-x', '0px');\n      root.style.setProperty('--story-pointer-y', '0px');",
          )
          director = director.replace(
              "        root.dataset.storyChapter = String(nextIndex + 1).padStart(2, '0');\n        setSceneState(scenes, nextIndex);",
              "        root.dataset.storyChapter = String(nextIndex + 1).padStart(2, '0');\n        document.body.dataset.animeScene = scenes[nextIndex]?.dataset.animeScene ?? 'ice';\n        setSceneState(scenes, nextIndex);",
          )
          director = director.replace(
              "          scene.removeAttribute('aria-hidden');\n          scene.dataset.active = 'true';",
              "          scene.removeAttribute('aria-hidden');\n          scene.inert = false;\n          scene.dataset.active = 'true';",
          )
          director = director.replace(
              "          root.style.setProperty('--story-pointer-x', pointerX.toFixed(4));\n          root.style.setProperty('--story-pointer-y', pointerY.toFixed(4));",
              "          root.style.setProperty('--story-pointer-x', `${(pointerX * 14).toFixed(2)}px`);\n          root.style.setProperty('--story-pointer-y', `${(pointerY * 10).toFixed(2)}px`);",
          )
          director_path.write_text(director, encoding='utf-8')

          css_path = Path('src/styles/anime-scroll-story.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('--story-pointer-x: 0;', '--story-pointer-x: 0px;')
          css = css.replace('--story-pointer-y: 0;', '--story-pointer-y: 0px;')
          css = css.replace('calc(var(--story-pointer-x) * -8px)', 'var(--story-pointer-x)')
          css = css.replace('calc(var(--story-pointer-y) * -5px)', 'var(--story-pointer-y)')
          css = css.replace('calc(var(--story-pointer-x) * 8px)', 'var(--story-pointer-x)')
          css = css.replace('calc(var(--story-pointer-y) * 6px)', 'var(--story-pointer-y)')
          css = css.replace('calc(var(--story-pointer-x) * 4px)', 'var(--story-pointer-x)')
          css = css.replace('calc(var(--story-pointer-x) * -8px)', 'var(--story-pointer-x)')
          css = css.replace('calc(var(--story-pointer-x) * 14px)', 'var(--story-pointer-x)')
          css = css.replace('calc(var(--story-pointer-x) * 20px)', 'var(--story-pointer-x)')
          css = css.replace('calc(-50% + var(--story-pointer-y) * 12px)', 'calc(-50% + var(--story-pointer-y))')
          css = css.replace('calc(var(--story-pointer-x) * 22px)', 'var(--story-pointer-x)')
          css = css.replace('calc(var(--story-pointer-y) * 14px)', 'var(--story-pointer-y)')
          css = css.replace('rotateY(calc(var(--story-pointer-x) * -4deg)) rotateX(calc(var(--story-pointer-y) * 3deg))', 'rotateY(-2deg) rotateX(1deg)')
          css_path.write_text(css, encoding='utf-8')
          PY
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/home/AnimeScrollStory.astro \
            src/components/pages/HomePage.astro \
            src/styles/anime-scroll-story.css \
            tests/e2e/hero-motion.spec.ts
          rm .github/workflows/refine-anime-story.yml
      - name: 調整結果を反映
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "スクロールストーリーの視差と操作性を調整"
          git push origin HEAD:feat/anime-scroll-story
