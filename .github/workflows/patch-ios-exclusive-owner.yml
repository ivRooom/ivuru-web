name: Patch iOS Exclusive Story Owner

on:
  push:
    branches:
      - fix/ios-webkit-story-scroll

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: iOS Story制御の所有権を一本化
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery = Path('src/components/effects/IOSStoryDirectorRecovery.astro')
          text = recovery.read_text()
          replacements = [
              ('    const recoveryDelay = 1_200;\n', '    const recoveryDelay = 0;\n    const recoveryHeartbeatMs = 120;\n'),
              ('      let timer = 0;\n      let frame = 0;\n', '      let timer = 0;\n      let heartbeat = 0;\n      let frame = 0;\n'),
              (
                  """      let observer;

      const realDirectorIsReady = () =>
""",
                  """      let observer;

      root.dataset.storyNativeRecovery = 'true';
      root.dataset.storyPlatform = 'ios-webkit';

      const realDirectorIsReady = () =>
""",
              ),
              (
                  """      const onScroll = () => {
        if (!recoveryActive && !realDirectorIsReady()) activate();
        scheduleSync();
      };
""",
                  """      const onScroll = () => {
        if (!recoveryActive && !realDirectorIsReady()) activate();
        sync();
        scheduleSync();
      };
""",
              ),
              (
                  """      observer = new MutationObserver(() => {
        if (recoveryActive) scheduleSync();
      });
""",
                  """      observer = new MutationObserver(() => {
        if (recoveryActive) sync();
      });
""",
              ),
              (
                  """      timer = window.setTimeout(activate, recoveryDelay);
      window.addEventListener('scroll', onScroll, { passive: true });
""",
                  """      timer = window.setTimeout(activate, recoveryDelay);
      heartbeat = window.setInterval(sync, recoveryHeartbeatMs);
      window.addEventListener('scroll', onScroll, { passive: true });
""",
              ),
              (
                  """        window.clearTimeout(timer);
        cancelAnimationFrame(frame);
""",
                  """        window.clearTimeout(timer);
        window.clearInterval(heartbeat);
        cancelAnimationFrame(frame);
""",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Recovery patch target not found:\n{old}')
              text = text.replace(old, new, 1)
          recovery.write_text(text)

          director = Path('src/components/effects/AnimeScrollDirector.tsx')
          text = director.read_text()
          old = """    const setup = () => {
      cleanup();
      const elements = readStoryElements();
"""
          new = """    const setup = () => {
      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');
      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;
      cleanup();
      const elements = readStoryElements();
"""
          if old not in text:
              raise SystemExit('AnimeScrollDirector setup target not found')
          director.write_text(text.replace(old, new, 1))

          runtime = Path('src/components/effects/StoryProductionRuntime.tsx')
          text = runtime.read_text()
          old = """    const setup = async () => {
      disposeCurrent();
      generation += 1;
"""
          new = """    const setup = async () => {
      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');
      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;
      disposeCurrent();
      generation += 1;
"""
          if old not in text:
              raise SystemExit('StoryProductionRuntime setup target not found')
          runtime.write_text(text.replace(old, new, 1))

          bridge = Path('src/components/effects/IOSStoryStabilityBridge.tsx')
          text = bridge.read_text()
          old = """      const { root, scenes, dots, readout, progressLine } = elements;
      if (!isIOSWebKit()) return;

      let disposed = false;
"""
          new = """      const { root, scenes, dots, readout, progressLine } = elements;
      if (!isIOSWebKit()) return;
      root.dataset.storyPlatform = 'ios-webkit';
      if (root.dataset.storyNativeRecovery === 'true') return;

      let disposed = false;
"""
          if old not in text:
              raise SystemExit('IOSStoryStabilityBridge guard target not found')
          text = text.replace(old, new, 1)
          text = text.replace("      root.dataset.storyPlatform = 'ios-webkit';\n", '', 1)
          bridge.write_text(text)

          contract = Path('tests/unit/ios-story-director-recovery-contract.test.ts')
          text = contract.read_text()
          text = text.replace("expect(source).toContain('const recoveryDelay = 1_200');", "expect(source).toContain('const recoveryDelay = 0');", 1)
          anchor = """    expect(source).toContain('new MutationObserver');
"""
          addition = """    expect(source).toContain('new MutationObserver');
    expect(source).toContain('const recoveryHeartbeatMs = 120');
    expect(source).toContain('window.setInterval(sync, recoveryHeartbeatMs)');

    const director = readSource('src/components/effects/AnimeScrollDirector.tsx');
    const runtime = readSource('src/components/effects/StoryProductionRuntime.tsx');
    const bridge = readSource('src/components/effects/IOSStoryStabilityBridge.tsx');
    expect(director).toContain("storyNativeRecovery === 'true'");
    expect(runtime).toContain("storyNativeRecovery === 'true'");
    expect(bridge).toContain("storyNativeRecovery === 'true'");
"""
          if anchor not in text:
              raise SystemExit('Recovery contract anchor not found')
          contract.write_text(text.replace(anchor, addition, 1))
          PY
          npx prettier --write \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            tests/unit/ios-story-director-recovery-contract.test.ts
          npm run check
          npm test
      - name: 修正をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            tests/unit/ios-story-director-recovery-contract.test.ts
          git commit -m "iOS Story制御をInline Recoveryへ一本化"
          git push origin HEAD:fix/ios-webkit-story-scroll
