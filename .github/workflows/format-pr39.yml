name: Format PR39

on:
  push:
    branches:
      - feat/anime-cyber-png-x-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-cyber-png-x-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            src/components/home/WorldPortalSection.astro \
            src/components/pages/HomePage.astro \
            src/components/pages/ProfilePage.astro \
            src/components/profile/XProfileIdentity.tsx \
            src/data/site-config.ts \
            src/layouts/BaseLayout.astro \
            src/styles/anime-cyber-renewal.css \
            src/worker-entry.ts \
            src/worker/x-profile.ts \
            tests/e2e/loader-metadata.spec.ts \
            tests/e2e/x-profile.spec.ts \
            tests/unit/x-profile.test.ts \
            wrangler.jsonc \
            docs/ASSET_REQUIREMENTS.md \
            docs/X_PROFILE_SETUP.md
          rm .github/workflows/format-pr39.yml
      - name: 整形結果を反映
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR39の変更ファイルを整形"
          git push origin HEAD:feat/anime-cyber-png-x-profile
