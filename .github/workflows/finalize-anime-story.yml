name: Finalize Anime Story CSS

on:
  push:
    branches:
      - feat/anime-scroll-story

permissions:
  contents: write

jobs:
  finalize-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-scroll-story
      - name: CSS規約とリンク表示を調整
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/anime-scroll-story.css')
          css = path.read_text(encoding='utf-8')
          css = css.replace('  --story-progress: 0;\n  position:', '  --story-progress: 0;\n\n  position:')
          css = css.replace('currentColor', 'currentcolor')
          css = css.replace(
              '  --card-tilt-y: 0deg;\n  flex: 1;',
              '  --card-tilt-y: 0deg;\n\n  display: block;\n  flex: 1;',
          )
          css = css.replace(
              '  min-width: 0;\n  perspective: 900px;',
              '  min-width: 0;\n  color: inherit;\n  text-decoration: none;\n  perspective: 900px;',
          )
          path.write_text(css, encoding='utf-8')
          PY
          rm .github/workflows/finalize-anime-story.yml
      - name: 最終調整を反映
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "アニメストーリーCSSを最終調整"
          git push origin HEAD:feat/anime-scroll-story
