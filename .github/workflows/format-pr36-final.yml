name: Format PR36 Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/contact-api-routing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-api-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PR変更ファイルを整形
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml' | xargs -0 -r npx prettier --write
      - name: 整形結果をコミット
        run: |
          rm .github/workflows/format-pr36-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR #36の変更ファイルを最終整形"
          git push origin HEAD:fix/contact-api-routing
