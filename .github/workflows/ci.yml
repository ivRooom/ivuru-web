name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-ios-director:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/ios-webkit-story-scroll' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Directorの世代競合を修正
        run: |
          python - <<'PY'
          from pathlib import Path

          director = Path('src/components/effects/AnimeScrollDirector.tsx')
          text = director.read_text()

          replacements = [
              (
                  '    let initialized = false;\n',
                  '    let initializationToken: number | null = null;\n',
              ),
              (
                  '      initialized = false;\n',
                  '      initializationToken = null;\n',
              ),
              (
                  """    const initializeMotion = async (elements: StoryElements, token: number) => {
      if (initialized || reducedMotion.matches) return;
      initialized = true;

      const [gsapModule, triggerModule] = await Promise.all([
        import('gsap'),
        import('gsap/ScrollTrigger'),
      ]);
      if (token !== generation || reducedMotion.matches || !elements.root.isConnected) return;
""",
                  """    const initializeMotion = async (elements: StoryElements, token: number) => {
      if (
        token !== generation ||
        reducedMotion.matches ||
        initializationToken === token ||
        !elements.root.isConnected
      )
        return;
      initializationToken = token;

      const modules = await Promise.all([import('gsap'), import('gsap/ScrollTrigger')]).catch(
        (error: unknown) => {
          if (token !== generation || !elements.root.isConnected) return null;
          console.error('[AnimeScrollDirector] GSAPの読込に失敗しました。', error);
          initializationToken = null;
          elements.root.dataset.storyRuntimeReason = 'director-import-failed';
          setStaticMode(elements);
          return null;
        },
      );
      if (!modules) return;
      const [gsapModule, triggerModule] = modules;
      if (token !== generation || reducedMotion.matches || !elements.root.isConnected) {
        if (initializationToken === token) initializationToken = null;
        return;
      }
""",
              ),
              (
                  """      if (!('IntersectionObserver' in window)) {
        void initializeMotion(elements, token);
        return;
      }
""",
                  """      const iosWebKit =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (iosWebKit || !('IntersectionObserver' in window)) {
        elements.root.dataset.storyInView = 'true';
        void initializeMotion(elements, token);
        return;
      }
""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'patch target not found:\n{old}')
              text = text.replace(old, new, 1)

          director.write_text(text)

          contract = Path('tests/unit/ios-story-stability-contract.test.ts')
          text = contract.read_text()
          anchor = """    expect(source).toContain("source: 'ios-stability-bridge'");
"""
          addition = """    expect(source).toContain("source: 'ios-stability-bridge'");

    const directorSource = readSource('src/components/effects/AnimeScrollDirector.tsx');
    expect(directorSource).toContain('let initializationToken: number | null = null');
    expect(directorSource).toContain('initializationToken === token');
    expect(directorSource).toContain('token !== generation');
    expect(directorSource).toContain("storyRuntimeReason = 'director-import-failed'");
    expect(directorSource).toContain("elements.root.dataset.storyInView = 'true'");
"""
          if anchor not in text:
              raise SystemExit('contract anchor not found')
          contract.write_text(text.replace(anchor, addition, 1))
          PY
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            tests/unit/ios-story-stability-contract.test.ts
          npm run check
          npm test -- --run tests/unit/ios-story-stability-contract.test.ts
      - name: 修正結果をコミット
        run: |
          if git diff --quiet; then
            echo "修正差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/AnimeScrollDirector.tsx \
            tests/unit/ios-story-stability-contract.test.ts
          git commit -m "iOS Directorの初期化世代競合を修正"
          git push origin HEAD:fix/ios-webkit-story-scroll

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        run: npm audit --omit=dev --audit-level=high
      - name: Astro Checkを実行
        id: astro-check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Astro Check診断Artifactを保存
        if: failure() && steps.astro-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_attempt }}
          path: astro-check.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
        id: lint
      - name: ESLint診断レポートを生成
        if: failure() && steps.lint.outcome == 'failure'
        run: npm run lint -- --format json > eslint-report.json || true
      - name: ESLint診断Artifactを保存
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_attempt }}
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivuru.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Durable ModeのBinding設定を確認
        run: npm run cloudflare:durable:check
      - name: NetlifyとCloudflareのAPI経路を確認
        run: npm run deployment:routing:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: Playwright iPhone WebKitを実行
        run: npx playwright test tests/e2e/story-ios-webkit.spec.ts --project=webkit-iphone
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
