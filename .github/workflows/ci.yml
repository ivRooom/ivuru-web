name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-ios-director:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: iOS Directorを先行起動してRuntimeを補完
        run: |
          python - <<'PY'
          from pathlib import Path

          director = Path('src/components/effects/AnimeScrollDirector.tsx')
          text = director.read_text()
          old = """      if (!('IntersectionObserver' in window)) {
            void initializeMotion(elements, token);
            return;
          }
"""
          new = """      const iosWebKit =
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

          if (compactViewport.matches || iosWebKit || !('IntersectionObserver' in window)) {
            elements.root.dataset.storyInView = 'true';
            void initializeMotion(elements, token);
            return;
          }
"""
          if old not in text:
              raise SystemExit('AnimeScrollDirector patch target not found')
          director.write_text(text.replace(old, new, 1))

          bridge = Path('src/components/effects/IOSStoryStabilityBridge.tsx')
          text = bridge.read_text()
          text = text.replace(
              'const RECOVERY_GRACE_MS = 12_000;',
              'const RECOVERY_GRACE_MS = 30_000;',
              1,
          )
          old = """        recoverPrematureFallback();
        if (
          root.dataset.storyDirector === 'ready' &&
          root.dataset.storyRuntime === 'ready' &&
          root.dataset.storyMode === 'motion'
        ) {
          root.dataset.storyMobileStability = 'ready';
"""
          new = """        recoverPrematureFallback();
        const storyTrigger = findStoryTrigger();
        if (
          root.dataset.storyDirector === 'ready' &&
          storyTrigger &&
          root.dataset.storyMode === 'motion'
        ) {
          root.dataset.storyRuntime = 'ready';
          root.dataset.storyProgressAuthority = 'ready';
          delete root.dataset.storyRuntimeReason;
          root.dataset.storyMobileStability = 'ready';
"""
          if old not in text:
              raise SystemExit('Bridge ready-state patch target not found')
          bridge.write_text(text.replace(old, new, 1))

          contract = Path('tests/unit/ios-story-stability-contract.test.ts')
          text = contract.read_text()
          text = text.replace(
              "expect(source).toContain('const RECOVERY_GRACE_MS = 12_000');",
              "expect(source).toContain('const RECOVERY_GRACE_MS = 30_000');",
              1,
          )
          anchor = """    expect(source).toContain(\"import '@/styles/story-ios-webkit-stability.css'\");
"""
          addition = """    expect(source).toContain(\"import '@/styles/story-ios-webkit-stability.css'\");

    const directorSource = readSource('src/components/effects/AnimeScrollDirector.tsx');
    expect(directorSource).toContain('compactViewport.matches || iosWebKit');
    expect(directorSource).toContain(\"elements.root.dataset.storyInView = 'true'\");
"""
          if anchor not in text:
              raise SystemExit('Contract director anchor not found')
          text = text.replace(anchor, addition, 1)
          bridge_anchor = """    expect(source).toContain('syncAuthorityFromDirector');
"""
          bridge_addition = """    expect(source).toContain('syncAuthorityFromDirector');
    expect(source).toContain('const storyTrigger = findStoryTrigger()');
    expect(source).toContain(\"root.dataset.storyRuntime = 'ready'\");
"""
          if bridge_anchor not in text:
              raise SystemExit('Contract bridge anchor not found')
          contract.write_text(text.replace(bridge_anchor, bridge_addition, 1))
          PY
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            tests/unit/ios-story-stability-contract.test.ts
      - name: 修正結果をコミット
        run: |
          if git diff --quiet; then
            echo "修正差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            tests/unit/ios-story-stability-contract.test.ts
          git commit -m "iOSではStory Directorを先行起動"
          git push origin HEAD:fix/ios-webkit-story-scroll

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        run: npm audit --omit=dev --audit-level=high
      - name: Astro Checkを実行
        id: astro-check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Astro Check診断Artifactを保存
        if: failure() && steps.astro-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_attempt }}
          path: astro-check.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
        id: lint
      - name: ESLint診断レポートを生成
        if: failure() && steps.lint.outcome == 'failure'
        run: npm run lint -- --format json > eslint-report.json || true
      - name: ESLint診断Artifactを保存
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_attempt }}
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivuru.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Durable ModeのBinding設定を確認
        run: npm run cloudflare:durable:check
      - name: NetlifyとCloudflareのAPI経路を確認
        run: npm run deployment:routing:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: Playwright iPhone WebKitを実行
        run: npx playwright test tests/e2e/story-ios-webkit.spec.ts --project=webkit-iphone
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
