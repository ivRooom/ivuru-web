name: Fix Loader Review Findings

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: fix-loader-review-findings
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: レビュー指摘を修正
        run: |
          python3 - <<'PY'
          from pathlib import Path

          demo_path = Path('docs/demos/spatial-engine-loader.html')
          demo = demo_path.read_text()
          demo = demo.replace(
              '    </style>\n  </head>',
              '''    </style>
    <noscript>
      <style>
        .loader {
          display: none !important;
        }
      </style>
    </noscript>
  </head>''',
              1,
          )
          demo = demo.replace(
              '        <p>空間エンジンを起動しています</p>',
              '        <p role="status" aria-live="polite" aria-atomic="true">空間エンジンを起動しています</p>',
              1,
          )
          demo = demo.replace(
              '          role="progressbar"\n          aria-valuemin="0"',
              '          role="progressbar"\n          aria-label="いゔる。を読み込んでいます"\n          aria-valuemin="0"',
              1,
          )
          demo_path.write_text(demo)

          loader_path = Path('src/components/common/IntroLoader.astro')
          loader = loader_path.read_text()
          loader = loader.replace(
              '      padding-inline: max(18px, env(safe-area-inset-left));',
              '''      padding-inline-start: max(18px, env(safe-area-inset-left));
      padding-inline-end: max(18px, env(safe-area-inset-right));''',
              1,
          )
          loader = loader.replace(
              '      padding-block: 14px;',
              '''      padding-block-start: max(14px, env(safe-area-inset-top));
      padding-block-end: max(14px, env(safe-area-inset-bottom));''',
              1,
          )
          loader_path.write_text(loader)
          PY
      - name: 整形と検証
        run: |
          npx prettier --write docs/demos/spatial-engine-loader.html src/components/common/IntroLoader.astro >/dev/null
          npm run check
          npm run lint
          npm test
          npm run build
      - name: 修正を反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demos/spatial-engine-loader.html src/components/common/IntroLoader.astro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ローダーのアクセシビリティとSafe Areaを修正"
          git push origin HEAD:feat/dual-3d-loading-experience
