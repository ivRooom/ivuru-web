name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run lint
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivurugg.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  format-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PR19の変更ファイルを整形
        run: |
          npx prettier --write \
            CONTACT_QUEUE_D1.md \
            src/components/contact/ContactStatusTerminal.tsx \
            src/components/contact/ContactTerminal.tsx \
            src/components/pages/ContactStatusPage.astro \
            src/components/pages/LegalPage.astro \
            src/pages/contact/status.astro \
            src/pages/en/contact/status.astro \
            src/pages/ko/contact/status.astro \
            src/worker.ts \
            src/worker/contact-storage.test.ts \
            src/worker/contact-storage.ts \
            wrangler.contact.example.jsonc \
            wrangler.jsonc
      - name: 整形済みファイルを保存
        uses: actions/upload-artifact@v4
        with:
          name: pr19-formatted
          path: |
            CONTACT_QUEUE_D1.md
            src/components/contact/ContactStatusTerminal.tsx
            src/components/contact/ContactTerminal.tsx
            src/components/pages/ContactStatusPage.astro
            src/components/pages/LegalPage.astro
            src/pages/contact/status.astro
            src/pages/en/contact/status.astro
            src/pages/ko/contact/status.astro
            src/worker.ts
            src/worker/contact-storage.test.ts
            src/worker/contact-storage.ts
            wrangler.contact.example.jsonc
            wrangler.jsonc
          retention-days: 1
