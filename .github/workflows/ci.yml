name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-ios-real-animation:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/ios-webkit-story-scroll' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ローダーとGSAP Directorの競合を修正
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/layouts/BaseLayout.astro')
          text = base.read_text()
          marker = "const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 350 : 2400;"
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('BaseLayout loader failsafe marker not found')
          block_start = text.rfind('    <script is:inline>', 0, marker_index)
          block_end = text.find('    </script>', marker_index)
          if block_start < 0 or block_end < 0:
              raise SystemExit('BaseLayout loader script range not found')
          block_end += len('    </script>')
          replacement = '''    <script is:inline>
                (() => {
                  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
                  const releaseFailsafe = () => {
                    const loader = document.querySelector('.world-loader');
                    if (!(loader instanceof HTMLElement)) return;
                    if (
                      loader.classList.contains('loaded') ||
                      document.documentElement.dataset.loaderReleased === 'true'
                    ) {
                      return;
                    }
                    document.documentElement.dataset.loaderReleased = 'true';
                    loader.classList.add('loaded');
                    loader.dataset.failsafeHidden = 'true';
                    document.body.classList.remove('site-loading');
                  };
                  const armFailsafe = () =>
                    window.setTimeout(releaseFailsafe, reduced ? 500 : 5_000);

                  if (document.readyState === 'complete') armFailsafe();
                  else window.addEventListener('load', armFailsafe, { once: true });
                })();
              </script>'''
          base.write_text(text[:block_start] + replacement + text[block_end:])

          director = Path('src/components/effects/AnimeScrollDirector.tsx')
          text = director.read_text()
          if 'const isIOSWebKit = () =>' not in text:
              anchor = 'const GATE_SHARD_COUNT = 10;\n'
              if anchor not in text:
                  raise SystemExit('AnimeScrollDirector constant anchor not found')
              text = text.replace(
                  anchor,
                  '''const GATE_SHARD_COUNT = 10;

          const isIOSWebKit = () =>
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          ''',
                  1,
              )
          observer_anchor = "      if (!('IntersectionObserver' in window)) {\n"
          if observer_anchor not in text:
              raise SystemExit('AnimeScrollDirector observer anchor not found')
          text = text.replace(
              observer_anchor,
              '''      if (isIOSWebKit()) {
                elements.root.dataset.storyInView = 'true';
                void initializeMotion(elements, token);
                return;
              }

              if (!('IntersectionObserver' in window)) {
          ''',
              1,
          )
          director.write_text(text)

          runtime = Path('src/components/effects/StoryProductionRuntime.tsx')
          text = runtime.read_text()
          if 'const isIOSWebKit = () =>' not in text:
              anchor = 'const clamp01 = (value: number) => Math.max(0, Math.min(1, value));\n'
              if anchor not in text:
                  raise SystemExit('StoryProductionRuntime helper anchor not found')
              text = text.replace(
                  anchor,
                  '''const clamp01 = (value: number) => Math.max(0, Math.min(1, value));

          const isIOSWebKit = () =>
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          ''',
                  1,
              )
          timeout_anchor = "          applyStaticStory(elements, 'motion-boot-timeout');\n"
          if timeout_anchor not in text:
              raise SystemExit('StoryProductionRuntime timeout anchor not found')
          text = text.replace(
              timeout_anchor,
              '''          if (isIOSWebKit()) {
                    root.dataset.storyRuntime = 'booting';
                    root.dataset.storyProgressAuthority = 'booting';
                    root.dataset.storyRuntimeReason = 'waiting-for-ios-director';
                    ScrollTrigger?.refresh();
                    requestRender();
                    return;
                  }
                  applyStaticStory(elements, 'motion-boot-timeout');
          ''',
              1,
          )
          runtime.write_text(text)
          PY

          npx prettier --write \
            src/layouts/BaseLayout.astro \
            src/components/common/LoaderReleaseGuard.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx
      - name: 修正をコミット
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/layouts/BaseLayout.astro \
            src/components/common/LoaderReleaseGuard.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx
          git diff --cached --quiet && exit 0
          git commit -m "iOSでロードとGSAPスクロール演出を復活"
          git push origin HEAD:${{ github.head_ref }}
