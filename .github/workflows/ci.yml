name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-ios-story-owner:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/ios-webkit-story-scroll' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: iOS Story制御をInline Recoveryへ一本化
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(path: str, anchor: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if anchor not in text:
                  raise SystemExit(f'Insert anchor not found: {path}: {anchor!r}')
              file.write_text(text.replace(anchor, anchor + addition, 1))

          insert_after(
              'src/components/effects/AnimeScrollDirector.tsx',
              '    const setup = () => {\n',
              "      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');\n"
              "      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;\n",
          )
          insert_after(
              'src/components/effects/StoryProductionRuntime.tsx',
              '    const setup = async () => {\n',
              "      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');\n"
              "      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;\n",
          )
          insert_after(
              'src/components/effects/IOSStoryStabilityBridge.tsx',
              '    const setup = async () => {\n',
              "      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');\n"
              "      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;\n",
          )

          recovery = Path('src/components/effects/IOSStoryDirectorRecovery.astro')
          text = recovery.read_text()
          anchor = '      let observer;\n'
          if anchor not in text:
              raise SystemExit('Recovery observer anchor not found')
          scroller_helpers = """

                const scrollingElement = () => document.scrollingElement ?? document.documentElement;
                const readScrollTop = () =>
                  Math.max(
                    window.scrollY,
                    scrollingElement().scrollTop,
                    document.documentElement.scrollTop,
                    document.body.scrollTop,
                  );
                const writeScrollTop = (top) => {
                  const nextTop = Math.max(0, Number(top));
                  scrollingElement().scrollTop = nextTop;
                  document.documentElement.scrollTop = nextTop;
                  document.body.scrollTop = nextTop;
                  window.scrollTo(0, nextTop);
                };
          """
          text = text.replace(anchor, anchor + scroller_helpers, 1)
          replacements = [
              (
                  'Math.max(0, Math.min(1, (window.scrollY - start) / Math.max(1, end - start)))',
                  'Math.max(0, Math.min(1, (readScrollTop() - start) / Math.max(1, end - start)))',
              ),
              (
                  'const rootTop = root.getBoundingClientRect().top + window.scrollY;',
                  'const rootTop = root.getBoundingClientRect().top + readScrollTop();',
              ),
              (
                  'window.scrollTo(0, start + (end - start) * progress);',
                  'writeScrollTop(start + (end - start) * progress);',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Recovery replacement not found: {old}')
              text = text.replace(old, new, 1)
          recovery.write_text(text)

          e2e = Path('tests/e2e/story-ios-webkit.spec.ts')
          text = e2e.read_text()
          start = text.find('const scrollTo = async (page: Page, top: number) => {')
          end = text.find('const scrollToProgress = async', start)
          if start < 0 or end < 0:
              raise SystemExit('E2E helper range not found')
          helpers = """const readScrollTop = (page: Page) =>
            page.evaluate(() =>
              Math.max(
                window.scrollY,
                document.scrollingElement?.scrollTop ?? 0,
                document.documentElement.scrollTop,
                document.body.scrollTop,
              ),
            );

          const scrollTo = async (page: Page, top: number) => {
            await page.evaluate((targetTop) => {
              const nextTop = Math.max(0, Number(targetTop));
              const scroller = document.scrollingElement ?? document.documentElement;
              scroller.scrollTop = nextTop;
              document.documentElement.scrollTop = nextTop;
              document.body.scrollTop = nextTop;
              window.scrollTo(0, nextTop);
              window.dispatchEvent(new Event('scroll'));
            }, top);
            await expect.poll(() => readScrollTop(page), { timeout: 5_000 }).toBeCloseTo(top, 0);
          };

          const revealStory = async (page: Page) => {
            const story = page.locator('[data-anime-scroll-story]');
            await story.scrollIntoViewIfNeeded();
            await page.evaluate(() => window.dispatchEvent(new Event('scroll')));
          };

          """
          e2e.write_text(text[:start] + helpers + text[end:])

          contract = Path('tests/unit/ios-story-director-recovery-contract.test.ts')
          text = contract.read_text()
          anchor = "    expect(source).toContain('const repairRootState = () =>');\n"
          if anchor not in text:
              raise SystemExit('Contract anchor not found')
          addition = """    expect(source).toContain('const scrollingElement = () =>');
              expect(source).toContain('const readScrollTop = () =>');
              expect(source).toContain('const writeScrollTop = (top) =>');

              const director = readSource('src/components/effects/AnimeScrollDirector.tsx');
              const runtime = readSource('src/components/effects/StoryProductionRuntime.tsx');
              const bridge = readSource('src/components/effects/IOSStoryStabilityBridge.tsx');
              expect(director).toContain("storyNativeRecovery === 'true'");
              expect(runtime).toContain("storyNativeRecovery === 'true'");
              expect(bridge).toContain("storyNativeRecovery === 'true'");
          """
          contract.write_text(text.replace(anchor, anchor + addition, 1))
          PY
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            tests/e2e/story-ios-webkit.spec.ts \
            tests/unit/ios-story-director-recovery-contract.test.ts
          npm run check
          npm test
      - name: 修正をコミット
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            tests/e2e/story-ios-webkit.spec.ts \
            tests/unit/ios-story-director-recovery-contract.test.ts
          git commit -m "iOS Story制御をInline Recoveryへ一本化"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        run: npm audit --omit=dev --audit-level=high
      - name: Astro Checkを実行
        id: astro-check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Astro Check診断Artifactを保存
        if: failure() && steps.astro-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_attempt }}
          path: astro-check.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
        id: lint
      - name: ESLint診断レポートを生成
        if: failure() && steps.lint.outcome == 'failure'
        run: npm run lint -- --format json > eslint-report.json || true
      - name: ESLint診断Artifactを保存
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_attempt }}
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivuru.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Durable ModeのBinding設定を確認
        run: npm run cloudflare:durable:check
      - name: NetlifyとCloudflareのAPI経路を確認
        run: npm run deployment:routing:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: Playwright iPhone WebKitを実行
        run: npx playwright test tests/e2e/story-ios-webkit.spec.ts --project=webkit-iphone
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
