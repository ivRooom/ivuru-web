name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-ios-story-owner:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/ios-webkit-story-scroll' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 競合RuntimeへiOS Recovery所有権ガードを追加
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              ('src/components/effects/AnimeScrollDirector.tsx', '    const setup = () => {\n'),
              ('src/components/effects/StoryProductionRuntime.tsx', '    const setup = async () => {\n'),
              ('src/components/effects/IOSStoryStabilityBridge.tsx', '    const setup = async () => {\n'),
          ]
          addition = (
              "      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');\n"
              "      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;\n"
          )

          for path, anchor in targets:
              file = Path(path)
              text = file.read_text()
              if "storyNativeRecovery === 'true'" in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'Guard anchor not found: {path}')
              file.write_text(text.replace(anchor, anchor + addition, 1))
          PY
          npx prettier --write \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx
      - name: ガード修正をコミット
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx
          git diff --cached --quiet && exit 0
          git commit -m "iOS Story制御をInline Recoveryへ一本化"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        run: npm audit --omit=dev --audit-level=high
      - name: Astro Checkを実行
        id: astro-check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Astro Check診断Artifactを保存
        if: failure() && steps.astro-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_attempt }}
          path: astro-check.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
        id: lint
      - name: ESLint診断レポートを生成
        if: failure() && steps.lint.outcome == 'failure'
        run: npm run lint -- --format json > eslint-report.json || true
      - name: ESLint診断Artifactを保存
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_attempt }}
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivuru.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Durable ModeのBinding設定を確認
        run: npm run cloudflare:durable:check
      - name: NetlifyとCloudflareのAPI経路を確認
        run: npm run deployment:routing:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: Playwright iPhone WebKitを実行
        run: npx playwright test tests/e2e/story-ios-webkit.spec.ts --project=webkit-iphone
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
