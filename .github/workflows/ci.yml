name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-ios-story-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-webkit-story-scroll
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: iOS Story制御をInline Recoveryへ一本化
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery = Path('src/components/effects/IOSStoryDirectorRecovery.astro')
          text = recovery.read_text()
          replacements = [
              ('    const recoveryDelay = 1_200;\n', '    const recoveryDelay = 0;\n    const recoveryHeartbeatMs = 120;\n'),
              ('      let timer = 0;\n      let frame = 0;\n', '      let timer = 0;\n      let heartbeat = 0;\n      let frame = 0;\n'),
              (
                  """      let observer;

      const realDirectorIsReady = () =>
""",
                  """      let observer;

      root.dataset.storyNativeRecovery = 'true';
      root.dataset.storyPlatform = 'ios-webkit';

      const realDirectorIsReady = () =>
""",
              ),
              (
                  """      const onScroll = () => {
        if (!recoveryActive && !realDirectorIsReady()) activate();
        scheduleSync();
      };
""",
                  """      const onScroll = () => {
        if (!recoveryActive && !realDirectorIsReady()) activate();
        sync();
        scheduleSync();
      };
""",
              ),
              (
                  """      observer = new MutationObserver(() => {
        if (recoveryActive) scheduleSync();
      });
""",
                  """      observer = new MutationObserver(() => {
        if (recoveryActive) sync();
      });
""",
              ),
              (
                  """      timer = window.setTimeout(activate, recoveryDelay);
      window.addEventListener('scroll', onScroll, { passive: true });
""",
                  """      timer = window.setTimeout(activate, recoveryDelay);
      heartbeat = window.setInterval(sync, recoveryHeartbeatMs);
      window.addEventListener('scroll', onScroll, { passive: true });
""",
              ),
              (
                  """        window.clearTimeout(timer);
        cancelAnimationFrame(frame);
""",
                  """        window.clearTimeout(timer);
        window.clearInterval(heartbeat);
        cancelAnimationFrame(frame);
""",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Recovery patch target not found:\n{old}')
              text = text.replace(old, new, 1)
          recovery.write_text(text)

          director = Path('src/components/effects/AnimeScrollDirector.tsx')
          text = director.read_text()
          old = """    const setup = () => {
      cleanup();
      const elements = readStoryElements();
"""
          new = """    const setup = () => {
      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');
      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;
      cleanup();
      const elements = readStoryElements();
"""
          if old not in text:
              raise SystemExit('AnimeScrollDirector setup target not found')
          director.write_text(text.replace(old, new, 1))

          runtime = Path('src/components/effects/StoryProductionRuntime.tsx')
          text = runtime.read_text()
          old = """    const setup = async () => {
      disposeCurrent();
      generation += 1;
"""
          new = """    const setup = async () => {
      const recoveryRoot = document.querySelector<HTMLElement>('[data-anime-scroll-story]');
      if (recoveryRoot?.dataset.storyNativeRecovery === 'true') return;
      disposeCurrent();
      generation += 1;
"""
          if old not in text:
              raise SystemExit('StoryProductionRuntime setup target not found')
          runtime.write_text(text.replace(old, new, 1))

          bridge = Path('src/components/effects/IOSStoryStabilityBridge.tsx')
          text = bridge.read_text()
          old = """      const { root, scenes, dots, readout, progressLine } = elements;
      if (!isIOSWebKit()) return;

      let disposed = false;
"""
          new = """      const { root, scenes, dots, readout, progressLine } = elements;
      if (!isIOSWebKit()) return;
      if (root.dataset.storyNativeRecovery === 'true') {
        root.dataset.storyPlatform = 'ios-webkit';
        return;
      }

      let disposed = false;
"""
          if old not in text:
              raise SystemExit('IOSStoryStabilityBridge guard target not found')
          bridge.write_text(text.replace(old, new, 1))

          contract = Path('tests/unit/ios-story-director-recovery-contract.test.ts')
          text = contract.read_text()
          text = text.replace(
              "expect(source).toContain('const recoveryDelay = 1_200');",
              "expect(source).toContain('const recoveryDelay = 0');",
              1,
          )
          anchor = """    expect(source).toContain('new MutationObserver');
"""
          addition = """    expect(source).toContain('new MutationObserver');
    expect(source).toContain('const recoveryHeartbeatMs = 120');
    expect(source).toContain('window.setInterval(sync, recoveryHeartbeatMs)');

    const director = readSource('src/components/effects/AnimeScrollDirector.tsx');
    const runtime = readSource('src/components/effects/StoryProductionRuntime.tsx');
    const bridge = readSource('src/components/effects/IOSStoryStabilityBridge.tsx');
    expect(director).toContain("storyNativeRecovery === 'true'");
    expect(runtime).toContain("storyNativeRecovery === 'true'");
    expect(bridge).toContain("storyNativeRecovery === 'true'");
"""
          if anchor not in text:
              raise SystemExit('Recovery contract anchor not found')
          contract.write_text(text.replace(anchor, addition, 1))
          PY
          npx prettier --write \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            tests/unit/ios-story-director-recovery-contract.test.ts
          npm run check
          npm test
      - name: 修正をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/effects/IOSStoryDirectorRecovery.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/StoryProductionRuntime.tsx \
            src/components/effects/IOSStoryStabilityBridge.tsx \
            tests/unit/ios-story-director-recovery-contract.test.ts
          git commit -m "iOS Story制御をInline Recoveryへ一本化"
          git push origin HEAD:fix/ios-webkit-story-scroll

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        run: npm audit --omit=dev --audit-level=high
      - name: Astro Checkを実行
        id: astro-check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Astro Check診断Artifactを保存
        if: failure() && steps.astro-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_attempt }}
          path: astro-check.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
        id: lint
      - name: ESLint診断レポートを生成
        if: failure() && steps.lint.outcome == 'failure'
        run: npm run lint -- --format json > eslint-report.json || true
      - name: ESLint診断Artifactを保存
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_attempt }}
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivuru.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Durable ModeのBinding設定を確認
        run: npm run cloudflare:durable:check
      - name: NetlifyとCloudflareのAPI経路を確認
        run: npm run deployment:routing:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: Playwright iPhone WebKitを実行
        run: npx playwright test tests/e2e/story-ios-webkit.spec.ts --project=webkit-iphone
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
