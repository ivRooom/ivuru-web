name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # TEMP_AUDIT_FIX_START
  dependency-audit-fix:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 修正版依存関係をlockfileへ反映
        run: npm audit fix --package-lock-only
      - name: High以上の脆弱性が解消したことを確認
        run: npm audit --omit=dev --audit-level=high
      - name: 一時ジョブをワークフローから削除
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          start_marker = '  # TEMP_AUDIT_FIX_START\n'
          end_marker = '  # TEMP_AUDIT_FIX_END\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          text = text.replace('  contents: write\n', '  contents: read\n', 1)
          path.write_text(text)
          PY
          npx prettier --write package-lock.json .github/workflows/ci.yml
      - name: lockfile更新をコミット
        run: |
          if git diff --quiet; then
            echo "依存関係の更新差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml
          git commit -m "依存パッケージの脆弱性を解消"
          git push origin HEAD:${{ github.head_ref }}
  # TEMP_AUDIT_FIX_END

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 本番依存関係の脆弱性を監査
        id: security-audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee npm-audit.json
      - name: 依存監査レポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.run_attempt }}
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Astro Checkを実行
        id: astro-check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee astro-check.log
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Astro Check診断Artifactを保存
        if: failure() && steps.astro-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-diagnostics-${{ github.run_attempt }}
          path: astro-check.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
        id: lint
      - name: ESLint診断レポートを生成
        if: failure() && steps.lint.outcome == 'failure'
        run: npm run lint -- --format json > eslint-report.json || true
      - name: ESLint診断Artifactを保存
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics-${{ github.run_attempt }}
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 変更ファイルのFormatを確認
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.astro' '*.css' '*.js' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
          if (( ${#files[@]} == 0 )); then
            echo "整形対象の変更ファイルはありません。"
          else
            printf 'Format check: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
      - name: Unit Testを実行
        id: unit-test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log
      - name: Unit Test診断Artifactを保存
        if: failure() && steps.unit-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics-${{ github.run_attempt }}
          path: unit-test.log
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivuru.ivrm.jp
      - name: 静的成果物を確認
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/sitemap-index.xml -o -f dist/sitemap.xml
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/en/index.html
          test -f dist/ko/index.html
      - name: Performance Budgetを確認
        run: npm run performance:check
      - name: Durable ModeのBinding設定を確認
        run: npm run cloudflare:durable:check
      - name: NetlifyとCloudflareのAPI経路を確認
        run: npm run deployment:routing:check
      - name: Wrangler設定をdry-runで検証
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Playwright iPhone WebKitを実行
        run: npx playwright test tests/e2e/story-ios-webkit.spec.ts --project=webkit-iphone
      - name: Playwright Chromiumを実行
        run: npm run test:e2e -- --project=chromium
      - name: E2E診断Artifactを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
