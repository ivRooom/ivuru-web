name: Format PR16

on:
  push:
    branches: [chore/dependency-ci-maintenance]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-ci-maintenance
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            .github/dependabot.yml \
            .github/workflows/ci.yml \
            README.md \
            package.json \
            package-lock.json \
            playwright.config.ts
          rm -f .github/workflows/format-pr16.yml
      - name: 変更をコミット
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "PR16の変更ファイルを整形"
          git push origin HEAD:chore/dependency-ci-maintenance
