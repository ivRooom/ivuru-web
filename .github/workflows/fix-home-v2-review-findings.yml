name: Fix Home V2 Review Findings

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-home-v2-review-findings.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: セクション余白セレクタを修正
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/styles/spatial-home-v2.css')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '.anime-story-after > .section,\n.anime-story-after > section.section {',
              '.anime-story-after > .anime-scene-anchor > .section,\n.anime-story-after > .anime-scene-anchor > section.section {',
          )
          source = source.replace(
              '  .anime-story-after > .section,\n  .anime-story-after > section.section {',
              '  .anime-story-after > .anime-scene-anchor > .section,\n  .anime-story-after > .anime-scene-anchor > section.section {',
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: 整形と検証
        run: |
          npx prettier --write src/styles/spatial-home-v2.css src/components/effects/SpatialCameraEnhancer.tsx tests/unit/home-v2-contract.test.ts >/dev/null
          npm run check
          npm run lint
          npm test
          npm run build
      - name: 検証済み修正を反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/spatial-home-v2.css src/components/effects/SpatialCameraEnhancer.tsx tests/unit/home-v2-contract.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Home V2レビュー指摘を修正"
          git push origin HEAD:feat/dual-3d-loading-experience
