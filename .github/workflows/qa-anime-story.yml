name: QA Anime Story

on:
  push:
    branches:
      - feat/anime-scroll-story

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anime-scroll-story
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: 依存関係をインストール
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 品質検査を実行
        id: quality
        shell: bash
        run: |
          set +e
          mkdir -p qa-output/logs
          : > qa-output/report.md
          echo '# Anime Scroll Story QA' >> qa-output/report.md
          echo '' >> qa-output/report.md
          overall=0
          run_check() {
            name="$1"
            shift
            "$@" > "qa-output/logs/${name}.log" 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "- ${name}: PASS" >> qa-output/report.md
            else
              echo "- ${name}: FAIL (${status})" >> qa-output/report.md
              overall=1
            fi
            return 0
          }
          run_check check npm run check
          run_check lint npm run lint
          run_check format npx prettier --check \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/home/AnimeScrollStory.astro \
            src/components/pages/HomePage.astro \
            src/styles/anime-scroll-story.css \
            tests/e2e/hero-motion.spec.ts
          run_check unit npm test
          run_check build npm run build
          if [ -d dist ]; then
            run_check performance npm run performance:check
            run_check deploy-check npm run deploy:check
            run_check e2e npm run test:e2e
          else
            echo '- performance: SKIP (build failed)' >> qa-output/report.md
            echo '- deploy-check: SKIP (build failed)' >> qa-output/report.md
            echo '- e2e: SKIP (build failed)' >> qa-output/report.md
            overall=1
          fi
          echo "overall=${overall}" >> "$GITHUB_OUTPUT"
      - name: 実画面を撮影
        shell: bash
        run: |
          if [ ! -d dist ]; then
            echo '- screenshots: SKIP (build failed)' >> qa-output/report.md
            exit 0
          fi
          nohup npm run preview -- --host 127.0.0.1 --port 4321 > qa-output/logs/preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321 >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321 >/dev/null
          cat > /tmp/capture-anime-story.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch();
          const states = [];
          const cases = [
            { name: 'desktop', width: 1440, height: 900, chapters: [1, 2, 3, 4] },
            { name: 'mobile', width: 390, height: 844, chapters: [1, 2, 3, 4] },
          ];

          try {
            for (const item of cases) {
              const context = await browser.newContext({
                viewport: { width: item.width, height: item.height },
                reducedMotion: 'no-preference',
                colorScheme: 'dark',
              });
              await context.addInitScript(() => {
                localStorage.setItem('ivuru-theme', 'dark');
                localStorage.setItem('ivuru-locale', 'ja');
                sessionStorage.setItem('ivuru-intro-seen', '1');
              });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
              await page.locator('.world-loader').waitFor({ state: 'hidden', timeout: 4000 }).catch(() => undefined);
              for (const chapter of item.chapters) {
                const index = chapter - 1;
                const top = index === 0 ? 0 : item.height * (index * 1.22 + 0.35);
                await page.evaluate((scrollTop) => window.scrollTo({ top: scrollTop, behavior: 'instant' }), top);
                await page.waitForTimeout(1100);
                const story = page.locator('[data-anime-scroll-story]');
                const active = await story.getAttribute('data-story-chapter');
                const activeScene = page.locator('[data-anime-story-scene][data-active="true"]');
                const box = await activeScene.boundingBox();
                const overflow = await page.evaluate(
                  () => document.documentElement.scrollWidth - document.documentElement.clientWidth,
                );
                states.push({ viewport: item.name, requestedChapter: chapter, active, box, overflow });
                await page.screenshot({
                  path: `qa-output/${item.name}-chapter-${chapter}.png`,
                  animations: 'allow',
                });
              }
              await context.close();
            }

            const reduced = await browser.newContext({
              viewport: { width: 390, height: 844 },
              reducedMotion: 'reduce',
              colorScheme: 'dark',
            });
            await reduced.addInitScript(() => {
              localStorage.setItem('ivuru-theme', 'dark');
              localStorage.setItem('ivuru-locale', 'ja');
              sessionStorage.setItem('ivuru-intro-seen', '1');
            });
            const reducedPage = await reduced.newPage();
            await reducedPage.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
            await reducedPage.locator('.world-loader').waitFor({ state: 'hidden', timeout: 2000 }).catch(() => undefined);
            await reducedPage.screenshot({
              path: 'qa-output/mobile-reduced-chapter-1.png',
              animations: 'disabled',
            });
            states.push({
              viewport: 'mobile-reduced',
              mode: await reducedPage.locator('[data-anime-scroll-story]').getAttribute('data-story-mode'),
              visibleScenes: await reducedPage.locator('[data-anime-story-scene]:visible').count(),
              overflow: await reducedPage.evaluate(
                () => document.documentElement.scrollWidth - document.documentElement.clientWidth,
              ),
            });
            await reduced.close();
          } finally {
            await browser.close();
          }

          await writeFile('qa-output/states.json', `${JSON.stringify(states, null, 2)}\n`);
          NODE
          node /tmp/capture-anime-story.mjs
          echo '- screenshots: PASS' >> qa-output/report.md
      - name: 失敗ログをレポートへ追加
        if: always()
        shell: bash
        run: |
          for log in qa-output/logs/*.log; do
            [ -f "$log" ] || continue
            if grep -Eqi 'error|failed|failure|×|✘' "$log"; then
              echo '' >> qa-output/report.md
              echo "## $(basename "$log")" >> qa-output/report.md
              echo '```text' >> qa-output/report.md
              tail -n 100 "$log" >> qa-output/report.md
              echo '```' >> qa-output/report.md
            fi
          done
          rm -rf qa-output/logs
          rm .github/workflows/qa-anime-story.yml
      - name: QA成果物を反映
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "アニメストーリーのQA結果を追加"
          git push origin HEAD:feat/anime-scroll-story
