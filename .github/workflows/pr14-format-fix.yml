name: PR14 format fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: ブランチを取得して変更ファイルを整形
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch feat/quality-command-center-analytics https://x-access-token:${GH_TOKEN}@github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          npx prettier --write \
            ANALYTICS_EVENT_MAP.md QUALITY_GATES.md package.json \
            .github/workflows/ci.yml .github/workflows/visual-regression.yml \
            scripts/check-performance-budget.mjs scripts/capture-visuals.mjs \
            src/components/common/AnalyticsBridge.astro \
            src/components/contact/ContactTerminal.tsx \
            src/components/home/ActivityCommandCenter.astro \
            src/components/pages/HomePage.astro \
            src/data/analytics-events.ts src/layouts/BaseLayout.astro \
            src/lib/analytics.ts src/styles/activity-command-center.css \
            src/worker.ts src/worker/contact.ts src/worker/contact.test.ts \
            tests/e2e/quality.spec.ts
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "PR14の変更ファイルを整形"
          git push origin HEAD:feat/quality-command-center-analytics
