name: Format Loader Release Fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-loader-release-fix.yml

permissions:
  contents: write

concurrency:
  group: format-loader-release-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --silent
      - name: 対象ファイルを整形
        run: |
          npx prettier --write \
            src/components/common/LoaderReleaseGuard.astro \
            src/components/pages/HomePageV2.astro \
            src/data/analytics-events.ts \
            src/styles/navigation-fix.css \
            tests/e2e/hero-motion.spec.ts \
            tests/e2e/loader-metadata.spec.ts \
            tests/e2e/quality.spec.ts >/dev/null
      - name: 静的検証
        run: |
          npm run check
          npm run lint
          npm test
          npm run build
      - name: 整形済みファイルを反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/common/LoaderReleaseGuard.astro \
            src/components/pages/HomePageV2.astro \
            src/data/analytics-events.ts \
            src/styles/navigation-fix.css \
            tests/e2e/hero-motion.spec.ts \
            tests/e2e/loader-metadata.spec.ts \
            tests/e2e/quality.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ローダー解除修正を標準整形"
          git push origin HEAD:feat/dual-3d-loading-experience
