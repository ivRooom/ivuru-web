name: Format World Forge

on:
  push:
    branches:
      - feat/dual-3d-loading-experience
    paths:
      - .github/workflows/format-world-forge.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ivRooom/ivuru-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 対象ブランチを取得
        uses: actions/checkout@v4
        with:
          ref: feat/dual-3d-loading-experience
          fetch-depth: 0
          persist-credentials: false

      - name: 依存関係を安全に取得
        run: npm ci --ignore-scripts --silent

      - name: World Forge変更ファイルを整形
        run: |
          npx prettier --write \
            src/components/common/IntroLoader.astro \
            src/components/effects/AnimeScrollDirector.tsx \
            src/components/effects/SpatialCameraEnhancer.tsx \
            src/components/pages/HomePageV2.astro \
            src/styles/chapter-gate-transitions.css \
            src/styles/quantum-gate-loader.css \
            tests/e2e/chapter-world-forge.spec.ts \
            tests/e2e/hero-motion.spec.ts \
            tests/e2e/loader-metadata.spec.ts \
            tests/unit/home-v2-contract.test.ts \
            tests/unit/orbital-loader-contract.test.ts \
            tests/unit/spatial-scroll-motion-contract.test.ts

      - name: 整形結果を反映して一時ワークフローを削除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm .github/workflows/format-world-forge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes'
            exit 0
          fi
          git commit -m 'World ForgeとQuantum GateをPrettierで整形'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/dual-3d-loading-experience
