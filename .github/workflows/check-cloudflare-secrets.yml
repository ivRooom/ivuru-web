name: Cloudflare Actions Secretを診断

on:
  push:
    branches: [chore/enable-contact-durable]

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/enable-contact-durable
          fetch-depth: 0

      - name: Secretの登録有無を記録
        shell: bash
        run: |
          set -euo pipefail
          token_status=missing
          account_status=missing
          test -n "${CLOUDFLARE_API_TOKEN:-}" && token_status=configured
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && account_status=configured

          cat > .github/cloudflare-secrets-status.md <<EOF
          # Cloudflare GitHub Actions Secret status

          | Secret | Status |
          | --- | --- |
          | CLOUDFLARE_API_TOKEN | $token_status |
          | CLOUDFLARE_ACCOUNT_ID | $account_status |
          EOF

          rm -f .github/workflows/check-cloudflare-secrets.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/cloudflare-secrets-status.md .github/workflows/check-cloudflare-secrets.yml
          git commit -m 'Cloudflare Actions Secretの診断結果を記録'
          git push origin HEAD:chore/enable-contact-durable
