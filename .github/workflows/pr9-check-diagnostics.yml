name: PR9 check diagnostics

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 型チェックの失敗箇所だけを出力
        run: |
          git clone -q --depth 1 --branch feat/world-chapter-social-policy https://github.com/ivRooom/ivuru-web.git repo
          cd repo
          npm ci --silent >/dev/null
          set +e
          npm run check > /tmp/check.log 2>&1
          status=$?
          cat /tmp/check.log
          exit $status
