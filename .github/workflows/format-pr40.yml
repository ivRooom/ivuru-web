name: Format PR40

on:
  push:
    branches:
      - feat/signal-loader-art-direction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signal-loader-art-direction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: 変更ファイルを整形
        run: |
          npx prettier --write \
            docs/ASSET_REQUIREMENTS.md \
            src/components/common/IntroLoader.tsx \
            src/components/common/MobileMenu.tsx \
            src/components/home/WorldPortalSection.astro \
            src/components/pages/HomePage.astro \
            src/components/pages/ProfilePage.astro \
            src/components/profile/XProfileIdentity.tsx \
            src/layouts/BaseLayout.astro \
            src/styles/signal-art-direction.css \
            tests/e2e/anime-experience.spec.ts \
            tests/e2e/hero-colorful.spec.ts \
            tests/e2e/hero-motion.spec.ts \
            tests/e2e/profile-avatar.spec.ts \
            tests/e2e/x-profile.spec.ts
          rm .github/workflows/format-pr40.yml
      - name: 整形結果を反映
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "PR40の変更ファイルを整形"
          git push origin HEAD:feat/signal-loader-art-direction
