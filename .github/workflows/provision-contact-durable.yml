name: Contact Durable Mode本番リソース作成

on:
  push:
    branches: [chore/contact-durable-production]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contact-durable-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.ref == 'chore/contact-durable-production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: ivuru-contact-production
      QUEUE_NAME: ivuru-contact-delivery
      DLQ_NAME: ivuru-contact-delivery-dlq
    steps:
      - name: ブランチを取得
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: chore/contact-durable-production
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Secret登録を確認
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'CLOUDFLARE_API_TOKENが未登録です。'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'CLOUDFLARE_ACCOUNT_IDが未登録です。'; exit 1; }

      - name: 依存関係をインストール
        run: npm ci

      - name: Cloudflare認証を確認
        run: npx wrangler whoami

      - name: D1・Queue・DLQを作成
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          json=(-H 'Content-Type: application/json')
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          d1_response="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/d1/database?per_page=100")"
          database_id="$(jq -r --arg name "$D1_NAME" '.result[] | select(.name == $name) | .uuid' <<<"$d1_response" | head -n1)"
          if [[ -z "$database_id" ]]; then
            create_response="$(curl --fail-with-body --silent --show-error -X POST "${auth[@]}" "${json[@]}" \
              "$api/d1/database" \
              --data "$(jq -cn --arg name "$D1_NAME" '{name:$name,primary_location_hint:"apac"}')")"
            database_id="$(jq -r '.result.uuid' <<<"$create_response")"
          fi
          [[ -n "$database_id" && "$database_id" != null ]] || { echo 'D1 database_idを取得できませんでした。'; exit 1; }
          echo "DATABASE_ID=$database_id" >> "$GITHUB_ENV"

          queues_response="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$api/queues?per_page=100")"
          for queue_name in "$QUEUE_NAME" "$DLQ_NAME"; do
            exists="$(jq -r --arg name "$queue_name" '[.result[] | select(.queue_name == $name)] | length' <<<"$queues_response")"
            if [[ "$exists" == 0 ]]; then
              curl --fail-with-body --silent --show-error -X POST "${auth[@]}" "${json[@]}" \
                "$api/queues" \
                --data "$(jq -cn --arg queue_name "$queue_name" '{queue_name:$queue_name}')" >/dev/null
            fi
          done

      - name: 本番Bindingを設定
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';

          const path = 'wrangler.jsonc';
          const databaseId = process.env.DATABASE_ID;
          if (!databaseId) throw new Error('DATABASE_ID is missing.');

          let config = fs.readFileSync(path, 'utf8');
          if (config.includes('"d1_databases"')) {
            config = config.replace(/"database_id":\s*"[^"]+"/, `"database_id": "${databaseId}"`);
          } else {
            const marker = '  "ratelimits": [';
            if (!config.includes(marker)) throw new Error('wrangler.jsonc insertion marker was not found.');
            const bindings = `  "d1_databases": [\n    {\n      "binding": "CONTACT_DB",\n      "database_name": "ivuru-contact-production",\n      "database_id": "${databaseId}",\n      "migrations_dir": "migrations",\n    },\n  ],\n\n  "queues": {\n    "producers": [\n      {\n        "binding": "CONTACT_DELIVERY_QUEUE",\n        "queue": "ivuru-contact-delivery",\n      },\n    ],\n    "consumers": [\n      {\n        "queue": "ivuru-contact-delivery",\n        "max_batch_size": 5,\n        "max_batch_timeout": 5,\n        "max_retries": 5,\n        "dead_letter_queue": "ivuru-contact-delivery-dlq",\n        "retry_delay": 60,\n      },\n    ],\n  },\n\n`;
            config = config.replace(marker, bindings + marker);
          }
          fs.writeFileSync(path, config);
          NODE
          npx prettier --write wrangler.jsonc

      - name: D1 Migrationを本番へ適用
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: D1テーブルを確認
        run: >-
          npx wrangler d1 execute "$D1_NAME" --remote --json
          --command "SELECT name FROM sqlite_master WHERE type='table' AND name='contact_requests'"

      - name: 品質ゲートを実行
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: https://ivurugg.ivrm.jp
        run: |
          npm run check
          npm run lint
          npm test
          npm run build
          npm run performance:check
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: 実行結果を記録
        shell: bash
        run: |
          cat > CONTACT_DURABLE_PROVISIONING.md <<EOF
          # Contact Durable Mode provisioning result

          The production Cloudflare resources were provisioned from GitHub Actions.

          - D1: \`$D1_NAME\`
          - D1 database ID: \`$DATABASE_ID\`
          - Queue: \`$QUEUE_NAME\`
          - Dead-letter queue: \`$DLQ_NAME\`
          - Migration: applied
          - Table verification: \`contact_requests\`
          - Production Worker deployment: pending PR merge

          Runtime secrets are not stored in this repository.
          EOF
          rm -f .github/workflows/provision-contact-durable.yml

      - name: Binding設定をコミット
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wrangler.jsonc CONTACT_DURABLE_PROVISIONING.md .github/workflows/provision-contact-durable.yml
          git commit -m "Contact Durable Modeの本番リソースを作成"
          git push origin HEAD:chore/contact-durable-production
