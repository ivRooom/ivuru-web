<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Low-Poly Drive Loader</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0c;
      --white: #f8fbff;
      --blue: #38bdf8;
      --cyan: #a7ecff;
      --gold: #f6d47a;
      --muted: rgb(225 234 245 / 52%);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --spring: cubic-bezier(0.22, 1.24, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 44%, rgb(56 189 248 / 8%), transparent 34%),
        var(--bg);
      font-family: Inter, system-ui, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 52px);
      background: linear-gradient(145deg, #0a0a0c, #0d1016 52%, #08090c);
      opacity: 1;
      visibility: visible;
      transform: translateZ(0) scale(1);
      transition: opacity 420ms var(--ease), visibility 420ms var(--ease), transform 520ms var(--ease);
    }

    .loader::before {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        linear-gradient(rgb(255 255 255 / 2.5%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 2.5%) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, #000 0 28%, transparent 78%);
    }

    .loader.loaded {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateZ(0) scale(1.015);
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(940px, 100%);
      min-height: min(650px, calc(100svh - 48px));
      padding: clamp(20px, 3vw, 34px);
      border: 1px solid rgb(180 220 255 / 12%);
      border-radius: clamp(24px, 4vw, 42px);
      background: linear-gradient(145deg, rgb(255 255 255 / 3.5%), rgb(255 255 255 / 1%));
      box-shadow: inset 0 1px rgb(255 255 255 / 6%), 0 40px 120px rgb(0 0 0 / 34%);
    }

    .topline, .meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font: 650 0.6rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.16em;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      perspective: 1100px;
      transform-style: preserve-3d;
    }

    .road {
      position: relative;
      width: clamp(300px, 50vw, 560px);
      height: clamp(240px, 32vw, 340px);
      transform-style: preserve-3d;
    }

    .grid {
      position: absolute;
      top: 42%;
      left: 50%;
      width: 170%;
      height: 140%;
      background-image:
        linear-gradient(rgb(56 189 248 / 25%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(56 189 248 / 25%) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to top, #000, transparent 88%);
      transform-origin: top center;
      animation: grid-flow .82s linear infinite;
    }

    .horizon {
      position: absolute;
      top: 42%;
      right: 2%;
      left: 2%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      box-shadow: 0 0 24px rgb(56 189 248 / 35%);
    }

    .car {
      position: absolute;
      z-index: 4;
      top: 44%;
      left: 50%;
      width: 190px;
      height: 92px;
      transform-style: preserve-3d;
      animation: car-spring .84s var(--spring) infinite;
    }

    .body {
      position: absolute;
      top: 28px;
      left: 8px;
      width: 174px;
      height: 48px;
      clip-path: polygon(8% 28%, 22% 4%, 76% 0, 96% 28%, 100% 74%, 86% 100%, 10% 94%, 0 66%);
      background: linear-gradient(145deg, #f8fbff 0 18%, #7bdcff 38%, #1678aa 78%, #072d43 100%);
      box-shadow: 0 18px 38px rgb(0 0 0 / 34%);
      transform: translateZ(20px);
    }

    .body::after {
      position: absolute;
      top: 10px;
      right: 20px;
      left: 24px;
      height: 2px;
      content: "";
      background: linear-gradient(90deg, transparent, rgb(255 255 255 / 72%), transparent);
    }

    .cabin {
      position: absolute;
      top: 8px;
      left: 58px;
      width: 82px;
      height: 42px;
      clip-path: polygon(18% 0, 76% 0, 100% 100%, 0 100%);
      background: linear-gradient(145deg, #b7efff, #175c81 58%, #081c2a);
      border: 1px solid rgb(255 255 255 / 34%);
      transform: translateZ(28px) rotateX(-3deg);
    }

    .wheel {
      position: absolute;
      top: 60px;
      width: 34px;
      aspect-ratio: 1;
      border: 6px solid #050608;
      border-radius: 50%;
      background: #1b2028;
      box-shadow: 0 0 0 2px rgb(255 255 255 / 12%);
      transform: translateZ(32px);
    }

    .wheel::after {
      position: absolute;
      inset: 7px;
      content: "";
      border: 2px dashed rgb(167 236 255 / 56%);
      border-radius: 50%;
      animation: wheel-spin .58s linear infinite;
    }

    .front { right: 24px; }
    .back { left: 24px; }

    .light {
      position: absolute;
      z-index: 3;
      top: 43px;
      width: 9px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 16px rgb(246 212 122 / 62%);
      transform: translateZ(34px);
    }
    .light.left { left: 15px; }
    .light.right { right: 15px; }

    .shadow {
      position: absolute;
      top: 82px;
      left: 24px;
      width: 150px;
      height: 18px;
      border-radius: 50%;
      background: rgb(0 0 0 / 38%);
      animation: shadow .84s var(--spring) infinite;
    }

    .copy { position: absolute; right: 0; bottom: 0; left: 0; text-align: center; }
    .copy p, .copy span {
      color: var(--muted);
      font: 650 0.62rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.17em;
    }
    .copy strong {
      display: block;
      margin: 10px 0 8px;
      font-size: clamp(3rem, 8vw, 5.4rem);
      line-height: 0.9;
      letter-spacing: -0.11em;
      text-shadow: 0 18px 50px rgb(56 189 248 / 18%);
    }

    .footer { display: grid; gap: 16px; margin-top: 26px; }
    .meter { display: grid; grid-template-columns: 1fr 3ch; gap: 12px; align-items: center; }
    .meter span { position: relative; height: 2px; background: rgb(255 255 255 / 10%); }
    .meter i {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress, 0%);
      background: linear-gradient(90deg, var(--gold), var(--blue));
      box-shadow: 0 0 16px rgb(56 189 248 / 42%);
      transition: width 90ms linear;
    }
    .meter b { font: 650 0.68rem/1 ui-monospace, monospace; }

    @keyframes grid-flow {
      from { transform: translate3d(-50%, -42px, -70px) rotateX(68deg); }
      to { transform: translate3d(-50%, 42px, -70px) rotateX(68deg); }
    }
    @keyframes car-spring {
      0%, 100% { transform: translate3d(-50%, -50%, 44px) scale3d(1.02, .98, 1); }
      42% { transform: translate3d(-50%, -58%, 54px) scale3d(.98, 1.035, 1); }
      68% { transform: translate3d(-50%, -49%, 45px) scale3d(1.01, .99, 1); }
    }
    @keyframes shadow {
      0%, 100% { transform: translateZ(-6px) scaleX(1); opacity: .46; }
      42% { transform: translateZ(-6px) scaleX(.78); opacity: .28; }
    }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .loader { transition-duration: 1ms; }
      .grid, .car, .wheel::after, .shadow { animation: none; }
      .grid { transform: translate3d(-50%, 0, -70px) rotateX(68deg); }
      .car { transform: translate3d(-50%, -52%, 44px); }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <span role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">ページを読み込んでいます。</span>
    <div class="frame">
      <header class="topline"><span>IVURU / INITIALIZATION</span><span>LOW-POLY DRIVE</span></header>
      <main class="stage" aria-hidden="true">
        <div class="road">
          <div class="grid"></div><span class="horizon"></span>
          <div class="car">
            <span class="shadow"></span><span class="body"></span><span class="cabin"></span>
            <span class="light left"></span><span class="light right"></span>
            <span class="wheel front"></span><span class="wheel back"></span>
          </div>
          <div class="copy"><p>ドライブシステムを起動しています</p><strong>いゔる。</strong><span>BUILD. PLAY. CONNECT.</span></div>
        </div>
      </main>
      <footer class="footer">
        <div class="meta"><span>SYSTEM.STATUS: LOADING</span><span>FPS: 60 TARGET</span><span>RENDER: CSS_3D</span></div>
        <div class="meter" role="progressbar" aria-label="いゔる。を読み込んでいます" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span><i></i></span><b>000</b></div>
      </footer>
    </div>
  </div>
  <script>
    const loader = document.querySelector('#loader');
    const meter = loader.querySelector('[role="progressbar"]');
    const value = loader.querySelector('.meter b');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const started = performance.now();
    const duration = reduced ? 80 : 1200;

    const tick = (now) => {
      const progress = Math.min(100, Math.round(((now - started) / duration) * 100));
      loader.style.setProperty('--progress', `${progress}%`);
      meter.setAttribute('aria-valuenow', String(progress));
      value.textContent = String(progress).padStart(3, '0');
      if (progress < 100) requestAnimationFrame(tick);
      else loader.classList.add('loaded');
    };

    addEventListener('load', () => requestAnimationFrame(tick), { once: true });
  </script>
</body>
</html>
