<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit & Phase Loader</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0c;
      --white: #f8fbff;
      --blue: #38bdf8;
      --cyan: #a7ecff;
      --gold: #f6d47a;
      --muted: rgb(225 234 245 / 52%);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --spring: cubic-bezier(0.22, 1.24, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 42%, rgb(56 189 248 / 9%), transparent 32%),
        var(--bg);
      font-family: Inter, system-ui, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 52px);
      background: linear-gradient(145deg, #0a0a0c, #0d1016 52%, #08090c);
      opacity: 1;
      visibility: visible;
      transform: translateZ(0) scale(1);
      transition: opacity 420ms var(--ease), visibility 420ms var(--ease), transform 520ms var(--ease);
    }

    .loader::before {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        linear-gradient(rgb(255 255 255 / 2.5%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 2.5%) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, #000 0 28%, transparent 78%);
    }

    .loader.loaded {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateZ(0) scale(1.015);
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(900px, 100%);
      min-height: min(650px, calc(100svh - 48px));
      padding: clamp(20px, 3vw, 34px);
      border: 1px solid rgb(180 220 255 / 12%);
      border-radius: clamp(24px, 4vw, 42px);
      background: linear-gradient(145deg, rgb(255 255 255 / 3.5%), rgb(255 255 255 / 1%));
      box-shadow: inset 0 1px rgb(255 255 255 / 6%), 0 40px 120px rgb(0 0 0 / 34%);
    }

    .topline, .meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font: 650 0.6rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.16em;
    }

    .stage {
      display: grid;
      place-items: center;
      perspective: 1100px;
      transform-style: preserve-3d;
    }

    .orbit {
      position: relative;
      width: clamp(230px, 36vw, 370px);
      aspect-ratio: 1;
      transform-style: preserve-3d;
      animation: breathe 3.2s var(--ease) infinite;
    }

    .ring {
      position: absolute;
      inset: 8%;
      border: 1px solid rgb(167 236 255 / 42%);
      border-radius: 50%;
      box-shadow: 0 0 28px rgb(56 189 248 / 8%);
      transform-style: preserve-3d;
    }

    .ring::after {
      position: absolute;
      top: 50%;
      left: -5px;
      width: 9px;
      aspect-ratio: 1;
      content: "";
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 0 18px rgb(167 236 255 / 64%);
      transform: translateY(-50%);
    }

    .outer { animation: outer 5.4s linear infinite; }
    .middle {
      inset: 18%;
      border-color: rgb(246 212 122 / 38%);
      animation: middle 4.2s linear infinite reverse;
    }
    .middle::after { background: var(--gold); box-shadow: 0 0 18px rgb(246 212 122 / 52%); }
    .inner {
      inset: 28%;
      border-style: dashed;
      border-color: rgb(255 255 255 / 24%);
      animation: inner 3.4s linear infinite;
    }

    .sphere {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 27%, #fff 0 4%, #c9f3ff 13%, #5dcff7 34%, #12648d 66%, #06121d 100%);
      box-shadow: inset -22px -18px 38px rgb(0 0 0 / 48%), 0 0 46px rgb(56 189 248 / 24%);
      transform: translate3d(-50%, -50%, 56px);
    }

    .sphere::after {
      position: absolute;
      inset: -8%;
      content: "";
      border-radius: 50%;
      background: #071019;
      opacity: 0.78;
      animation: phase 2.8s var(--ease) infinite alternate;
    }

    .copy { text-align: center; }
    .copy p, .copy span {
      color: var(--muted);
      font: 650 0.62rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.17em;
    }
    .copy strong {
      display: block;
      margin: 10px 0 8px;
      font-size: clamp(3rem, 8vw, 5.4rem);
      line-height: 0.9;
      letter-spacing: -0.11em;
      text-shadow: 0 18px 50px rgb(56 189 248 / 18%);
    }

    .footer { display: grid; gap: 16px; margin-top: 26px; }
    .meter { display: grid; grid-template-columns: 1fr 3ch; gap: 12px; align-items: center; }
    .meter span { position: relative; height: 2px; background: rgb(255 255 255 / 10%); }
    .meter i {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--progress, 0%);
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      box-shadow: 0 0 16px rgb(56 189 248 / 42%);
      transition: width 90ms linear;
    }
    .meter b { font: 650 0.68rem/1 ui-monospace, monospace; }

    @keyframes outer { from { transform: rotateX(68deg) rotateZ(0); } to { transform: rotateX(68deg) rotateZ(360deg); } }
    @keyframes middle { from { transform: rotateY(64deg) rotateZ(0); } to { transform: rotateY(64deg) rotateZ(360deg); } }
    @keyframes inner { from { transform: rotateX(34deg) rotateY(54deg) rotateZ(0); } to { transform: rotateX(34deg) rotateY(54deg) rotateZ(360deg); } }
    @keyframes phase { from { transform: translate3d(72%, -2%, 2px) scale(1.05); } to { transform: translate3d(20%, 2%, 2px) scale(1.02); } }
    @keyframes breathe { 0%, 100% { transform: translate3d(0, 2px, 0) scale(.995); } 50% { transform: translate3d(0, -5px, 0) scale(1.01); } }

    @media (prefers-reduced-motion: reduce) {
      .loader { transition-duration: 1ms; }
      .orbit, .ring, .sphere::after { animation: none; }
      .sphere::after { transform: translate3d(42%, 0, 2px); }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <span role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">ページを読み込んでいます。</span>
    <div class="frame">
      <header class="topline"><span>IVURU / INITIALIZATION</span><span>ORBIT &amp; PHASE</span></header>
      <main class="stage" aria-hidden="true">
        <div class="orbit">
          <span class="ring outer"></span><span class="ring middle"></span><span class="ring inner"></span>
          <span class="sphere"></span>
        </div>
        <div class="copy"><p>軌道を同期しています</p><strong>いゔる。</strong><span>BUILD. PLAY. CONNECT.</span></div>
      </main>
      <footer class="footer">
        <div class="meta"><span>SYSTEM.STATUS: LOADING</span><span>FPS: 60 TARGET</span><span>RENDER: CSS_3D</span></div>
        <div class="meter" role="progressbar" aria-label="いゔる。を読み込んでいます" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span><i></i></span><b>000</b></div>
      </footer>
    </div>
  </div>
  <script>
    const loader = document.querySelector('#loader');
    const meter = loader.querySelector('[role="progressbar"]');
    const value = loader.querySelector('.meter b');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const started = performance.now();
    const duration = reduced ? 80 : 1200;

    const tick = (now) => {
      const progress = Math.min(100, Math.round(((now - started) / duration) * 100));
      loader.style.setProperty('--progress', `${progress}%`);
      meter.setAttribute('aria-valuenow', String(progress));
      value.textContent = String(progress).padStart(3, '0');
      if (progress < 100) requestAnimationFrame(tick);
      else loader.classList.add('loaded');
    };

    addEventListener('load', () => requestAnimationFrame(tick), { once: true });
  </script>
</body>
</html>
