  <circle cx="800" cy="390" r="282" fill="none" stroke="url(#ring)" stroke-width="34" opacity=".78" filter="url(#glow)"/>
  <circle cx="800" cy="390" r="230" fill="#fff" opacity=".18" filter="url(#soft)"/>

