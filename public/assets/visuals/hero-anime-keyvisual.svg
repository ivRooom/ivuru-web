<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ivuru anime world gate key visual</title>
  <desc id="desc">An original anime-inspired white-haired traveler standing before a colorful game world portal.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6be7ff"/>
      <stop offset=".42" stop-color="#a78cff"/>
      <stop offset=".72" stop-color="#ff8fcd"/>
      <stop offset="1" stop-color="#ffd98b"/>
    </linearGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fffef1"/>
      <stop offset=".22" stop-color="#bdf8ff"/>
      <stop offset=".52" stop-color="#8d8cff" stop-opacity=".86"/>
      <stop offset=".78" stop-color="#ff75c3" stop-opacity=".45"/>
      <stop offset="1" stop-color="#43216e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67f6ff"/>
      <stop offset=".32" stop-color="#fff39a"/>
      <stop offset=".62" stop-color="#ff78ca"/>
      <stop offset="1" stop-color="#997cff"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9fbff"/>
      <stop offset=".45" stop-color="#b8b8ff"/>
      <stop offset="1" stop-color="#7149a7"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5ff5ff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#5ff5ff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff18c" stop-opacity=".92"/>
      <stop offset=".8" stop-color="#ff76c8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff76c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <clipPath id="ground"><path d="M0 640C260 560 430 695 720 630s470-50 880 35v235H0z"/></clipPath>
  </defs>

