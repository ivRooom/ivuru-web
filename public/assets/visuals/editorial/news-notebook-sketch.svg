  <title id="title">News notebook editorial sketch</title>
  <desc id="desc">A hand-drawn open notebook with loose notes, a pen, and clipped paper.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="13" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9" />
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
