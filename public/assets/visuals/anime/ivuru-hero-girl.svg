  <title id="title">Ivuru original anime character</title>
  <desc id="desc">An original pastel anime girl holding a handheld game console beside a floating laptop and community icons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f5"/>
      <stop offset="0.48" stop-color="#f7edff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.9" y2="1">
