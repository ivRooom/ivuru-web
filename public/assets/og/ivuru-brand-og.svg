<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">いゔる。 / ivuru</title>
  <desc id="desc">Developer WorldとGamer Worldをつなぐ公式ポータル</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050714"/>
      <stop offset="0.48" stop-color="#081329"/>
      <stop offset="1" stop-color="#13071e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6ff"/>
      <stop offset="0.52" stop-color="#6f8cff"/>
      <stop offset="1" stop-color="#f078ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#80f4ff" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#4c8dff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#6e8eff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="280" cy="210" r="210" fill="#4c8dff" opacity=".15" filter="url(#blur)"/>
  <circle cx="920" cy="430" r="240" fill="#f078ff" opacity=".12" filter="url(#blur)"/>
  <g transform="translate(600 314)">
    <circle r="145" fill="url(#glow)" opacity=".42"/>
    <circle r="105" fill="none" stroke="#55e6ff" stroke-width="2" stroke-opacity=".65"/>
    <circle r="78" fill="none" stroke="#f078ff" stroke-width="2" stroke-opacity=".55" stroke-dasharray="8 12"/>
    <rect x="-52" y="-52" width="104" height="104" rx="22" fill="none" stroke="#8cefff" stroke-width="3" transform="rotate(45)"/>
    <rect x="-28" y="-28" width="56" height="56" rx="12" fill="#0a1028" stroke="#8f7dff" stroke-width="2" transform="rotate(45)"/>
    <circle r="12" fill="#fff"/>
  </g>
  <path d="M70 121H420" stroke="#55e6ff" stroke-opacity=".5"/>
  <path d="M780 509H1130" stroke="#f078ff" stroke-opacity=".45"/>
  <text x="72" y="84" fill="#8fefff" font-family="ui-monospace, monospace" font-size="18" letter-spacing="5">OFFICIAL WORLD PORTAL</text>
  <text x="72" y="270" fill="#f7f9ff" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="112" font-weight="800" letter-spacing="-8">いゔる。</text>
  <text x="78" y="332" fill="#62ebff" font-family="ui-monospace, monospace" font-size="28" font-weight="700" letter-spacing="10">IVURU</text>
  <text x="74" y="436" fill="#dbe5ff" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="34" font-weight="700">Developer World × Gamer World</text>
  <text x="76" y="486" fill="#93a3c9" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="24">つくる。遊ぶ。つなげる。</text>
  <text x="830" y="92" fill="#aab9dd" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3">BUILD. PLAY. CREATE.</text>
  <rect x="70" y="548" width="1060" height="2" fill="url(#line)" opacity=".78"/>
  <text x="72" y="584" fill="#6f7ea5" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">WORLD GATE / SYNCHRONIZED</text>
</svg>
